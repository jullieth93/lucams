# gitleaks config — Lucams_shop
#
# Detecta secrets en commits/PRs. Corre en CI via gitleaks-action.
# Si tira falso positivo legítimo, agregar a [[allowlist]] con justificación
# en el comentario.

title = "Lucams gitleaks config"

[extend]
# Empezamos con la baseline oficial. Cualquier regla extra se agrega
# debajo.
useDefault = true

[[rules]]
id = "supabase-secret-key-pattern"
description = "Supabase service_role / secret key"
# Detecta SUPABASE_SECRET_KEY=eyJ... fuera de .env.example
regex = '''(?i)SUPABASE_SECRET_KEY\s*=\s*['"]?(eyJ[A-Za-z0-9_\-]{20,})['"]?'''
keywords = ["SUPABASE_SECRET_KEY"]

[[rules]]
id = "wompi-private-key"
description = "Wompi private key (prv_prod_*)"
regex = '''prv_(test|prod)_[A-Za-z0-9_-]{20,}'''
keywords = ["prv_test_", "prv_prod_"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''re_[A-Za-z0-9_-]{20,}'''
keywords = ["re_"]

[allowlist]
description = "Placeholders y ejemplos en docs/env.example son seguros"
paths = [
    '''\.env\.example$''',
    '''docs/.*\.md$''',
    '''README\.md$''',
    '''\.gitleaks\.toml$''',
]
regexes = [
    '''PLACEHOLDER''',
    '''placeholder''',
    '''xxxxxxxx''',
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.placeholder''',
    # Falso positivo (2026-07-30): `key: "faq.03-metodos-pago"` en
    # packages/db/scripts/seed-cms-ruta-a.mjs — la regla default generic-api-key
    # ve una "key" con entropía suficiente en el slug de la FAQ. Son identificadores
    # de contenido CMS, no credenciales. Rompió CI en todos los push desde el
    # run 30499078411 hasta este fix.
    '''faq\.\d{2}-[a-z-]+''',
    # Falso positivo (2026-07-31): contraseñas de admins TEMPORALES que crean y
    # borran las specs e2e (tests/e2e/*audit*.spec.ts, release-check-a1.spec.ts)
    # contra la Supabase de dev — no son credenciales reales, viven minutos en
    # una corrida de tests. Mismo valor en varias specs por convención.
    '''[A-Za-z0-9]+-Admin-918273650''',
]
