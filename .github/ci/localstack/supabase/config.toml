# Stack LOCAL de Supabase para el Nightly CI (A3, 2026-07-31).
#
# Este workdir existe SOLO para que `supabase start` levante el stack SIN
# auto-aplicar migraciones: el CLI aplica <workdir>/supabase/migrations al
# boot, y las nuestras (repo: supabase/migrations/*) tocan tablas Prisma que a
# esa altura aún no existen → el boot fallaría. Al correr `supabase start`
# desde ESTE directorio (que no tiene supabase/migrations), el stack arranca
# pelado y el workflow aplica todo en el orden correcto:
#   prisma migrate deploy → psql supabase/migrations/* → seeds.
# Las credenciales del stack local son deterministas de desarrollo (las lee el
# workflow de `supabase status -o env`); no son secretos reales.
project_id = "lucams-ci"

# E2E admin-mfa del nightly: el enrolamiento/verificación TOTP viene APAGADO
# por default en el GoTrue del stack local ("MFA enroll is disabled for TOTP",
# run 30648462167) — se habilita acá para que la spec ejerza el flujo real.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Flujo OTP de auth cliente en el nightly (F-05, remediación R4 2026-09-26):
# homolog-auth.spec y app/(auth)/auth-actions.integration.test.ts ejercen el
# registro/recuperación REALES leyendo el código {{ .Token }} del Mailpit del
# stack (localhost:54324). Sin enable_confirmations + plantillas OTP, GoTrue
# autoconfirma el signup y manda un link PKCE genérico — nada que ver con el
# flujo de PRD (mismo criterio que supabase-local/supabase/config.toml; las
# plantillas son copia de las de ese directorio). El content_path se resuelve
# relativo a ESTE workdir.
[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Tu código de confirmación — Lucams (CI)"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Tu código para restablecer la contraseña — Lucams (CI)"
content_path = "./supabase/templates/recovery.html"
