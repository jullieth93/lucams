name: Backup DB → R2

# Backup off-site DIARIO de la base de datos a Cloudflare R2 (ADR-059, OPERATIONS.md).
# (2026-08-04: semanal → diario — una tienda viva no puede perder hasta 7 días de datos;
#  el dump pesa ~1.2 MB y el costo es el mismo. Retención 30 ≈ 1 mes de diarios.)
# (2026-09-04: nuevo job `backup-storage` — mirror cifrado de los buckets de Supabase
#  Storage a R2, hallazgo F-16 de la auditoría 2026-09-04: customer-uploads lleva las
#  fotos de las clientas (PII) y no tenía backup off-site.)
# Complementa el PITR de Supabase Pro con una copia independiente fuera de Supabase
# (DR drill #2: restore desde R2). NO usa Vercel Cron (mandato #11): es una tarea de
# OPS en GitHub Actions, no un background job de la app.
on:
  schedule:
    # Diario 07:13 UTC (~02:13 America/Bogotá). Los cron de GitHub corren en UTC.
    - cron: "13 7 * * *"
  workflow_dispatch: {} # permite dispararlo manualmente desde la pestaña Actions

# Least privilege: solo lectura del repo. Las credenciales viajan por secrets.
permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false # nunca cortar un backup a medias

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.0.9"

jobs:
  # Gate: si aún no están los secrets (R2 sin provisionar), el job de backup se SALTA
  # limpio (no falla → sin correos de error diarios). Publica un aviso recordando
  # configurar los secrets para activarlo.
  gate:
    name: ¿Secrets configurados?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      storage_configured: ${{ steps.check.outputs.storage_configured }}
    steps:
      - id: check
        env:
          HAS_DB: ${{ secrets.BACKUP_DATABASE_URL != '' }}
          # R2_BUCKET va incluido: `backup-db-to-r2.mjs` lo exige con requireEnv, así que sin él el
          # job pasaba el gate y reventaba en runtime cada día — justo el correo de error diario
          # que este gate existe para evitar.
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
          # F-16 (2026-09-04): el mirror de Storage tiene gate PROPIO — el backup de la DB no
          # debe apagarse ni ensuciarse si aún faltan los secrets de Supabase para storage.
          HAS_STORAGE: ${{ secrets.BACKUP_SUPABASE_URL != '' && secrets.BACKUP_SUPABASE_SECRET_KEY != '' }}
        run: |
          if [ "$HAS_DB" = "true" ] && [ "$HAS_R2" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backup R2 inactivo: faltan secrets. Configura BACKUP_DATABASE_URL y R2_ACCOUNT_ID/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY/R2_BUCKET en Settings → Secrets and variables → Actions para activar el backup diario."
          fi
          if [ "$HAS_R2" = "true" ] && [ "$HAS_STORAGE" = "true" ]; then
            echo "storage_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "storage_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backup de Storage inactivo: faltan secrets. Configura BACKUP_SUPABASE_URL y BACKUP_SUPABASE_SECRET_KEY (además de los R2_*) en Settings → Secrets and variables → Actions para activar el mirror diario de Supabase Storage."
          fi

  backup:
    name: pg_dump + subida a R2
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # El script sólo necesita @aws-sdk/client-s3 (devDep de apps/web). No hace falta
      # build ni prisma generate; con las deps instaladas basta.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El servidor Supabase es Postgres 17 → se requiere pg_dump 17 (versiones menores
      # rechazan el volcado). ubuntu-latest trae una versión anterior; instalamos la 17
      # desde el repo oficial PGDG.
      # La llave se guarda ARMADA (.asc), sin `gpg --dearmor`: bajo sudo y sin terminal, gpg
      # abortaba con "cannot open '/dev/tty'" y arrastraba a curl ("Failure writing output to
      # destination"). Es el método manual que documenta hoy postgresql.org, y apt acepta
      # keyrings armados en `signed-by=`. Nunca se había ejecutado porque el gate saltaba el
      # job mientras faltaban los secrets.
      - name: Instalar pg_dump 17 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Backup + subida a R2
        run: node apps/web/scripts/backup-db-to-r2.mjs
        env:
          # Conexión DIRECTA (no pooler) a la DB de PRODUCCIÓN. Secret a configurar por Lucy.
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Passphrase del cifrado gpg del dump (A-3, auditoría 2026-08-24). FAIL-CLOSED:
          # sin este secret el backup FALLA — crearlo en Settings → Secrets and variables
          # → Actions ANTES del próximo run programado. gpg viene preinstalado en el runner
          # (gnupg2 2.4.4 en la imagen ubuntu-24.04 de actions/runner-images — verificado
          # 2026-08-29; si ubuntu-latest cambia de imagen base, re-verificar).
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          BACKUP_KEEP: "30" # ~1 mes de backups diarios

  # F-16 (auditoría 2026-09-04): mirror cifrado de los buckets de Supabase Storage a R2.
  # Job SEPARADO del de la DB: comparte gate de secrets propio (storage_configured) para
  # que un faltante de BACKUP_SUPABASE_* no apague el backup de la DB ni lo ensucie en
  # rojo. Llaves `db-storage/<bucket>/lucams-<UTC>.tar.gz.gpg` + manifiesto JSON por
  # corrida; misma passphrase gpg y misma retención que el backup de la DB.
  backup-storage:
    name: Mirror de Supabase Storage → R2
    needs: gate
    if: needs.gate.outputs.storage_configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # El script necesita @aws-sdk/client-s3 (devDep de apps/web) y @supabase/supabase-js
      # (dependency de apps/web). No hace falta build ni pg_dump — gpg viene preinstalado
      # en el runner (ver la nota del job `backup`).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backup Storage + subida a R2
        run: node apps/web/scripts/backup-storage-to-r2.mjs
        env:
          # Credenciales Supabase DEDICADAS al backup (service/secret key server-side —
          # bypassea RLS para leer los buckets privados). Secrets a configurar por Lucy.
          BACKUP_SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          BACKUP_SUPABASE_SECRET_KEY: ${{ secrets.BACKUP_SUPABASE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # La MISMA passphrase del backup de la DB (A-3). Fail-closed: sin este secret el
          # job FALLA — un mirror sin cifrar de customer-uploads en R2 es inaceptable (PII).
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          BACKUP_KEEP: "30" # ~1 mes de mirrors diarios POR bucket (misma retención que la DB)
