name: Post-deploy smoke (PRD)

# F-08 (auditoría 2026-09-26, remediación R3; saneado 2026-11-03):
# Smoke post-deploy AUTOMATIZADO de PRD + verificación de deriva de migraciones Prisma.
#
# Triggers vigentes (2026-11-03):
#   - `deployment_status` nativo de Vercel (`environment == 'Production'` y
#     `state == 'success'`): dispara en el instante exacto en que Vercel termina
#     de servir el deploy de `production` (sin adivinar tiempos con `workflow_run`).
#   - `workflow_dispatch`: verificación manual bajo demanda.
#
# Por qué se retiró el `schedule` cada 30 min (2026-11-03):
#   - Duplicaba a `uptime-monitor-prd` (pg_cron en Supabase STG cada 10 min,
#     144 corridas/día puntuales con alerta por email vía Resend y latido en
#     `/admin/observability` — ver docs/OPERATIONS.md § Plan de monitoreo).
#   - Además `schedule` y `workflow_run` corrían sobre la rama por defecto
#     (`develop`) sin `ref: production`, comparando migraciones en pruebas de
#     STG contra la BD de PRD (falso rojo en `run 41551828115`). Ahora el
#     checkout fija explícitamente `ref: production`.

on:
  deployment_status: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: Health endpoints + journeys read-only de PRD
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: post-deploy-smoke
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CRÍTICO: siempre comparar contra la rama real de producción (`production`),
          # nunca contra el default branch (`develop`) donde pueden vivir migraciones
          # en etapa de validación STG.
          ref: production

      # Sin pnpm install ni build: el script es Node 22 pelado (fetch nativo),
      # cero dependencias — el smoke no debe depender del toolchain del repo.
      - name: Smoke post-deploy (health + homepage + catálogo)
        run: node apps/web/scripts/post-deploy-smoke.mjs
        env:
          SMOKE_BASE_URL: https://lucamsshop.com

      # Deriva de schema (2026-10-20): compara las migraciones de `production`
      # contra `_prisma_migrations` de PRD y falla ROJO si hay pendientes.
      - name: Migraciones Prisma + cron Lifecycle en PRD
        env:
          HAS_DB: ${{ secrets.BACKUP_DATABASE_URL != '' }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ "$HAS_DB" != "true" ]; then
            echo "::warning::Drift check inactivo: falta el secret BACKUP_DATABASE_URL"
            exit 0
          fi
          ls packages/db/prisma/migrations | grep -E '^[0-9]{14}_' | sort > /tmp/repo-migrations.txt
          psql "$BACKUP_DATABASE_URL" -tAc "select migration_name from _prisma_migrations where finished_at is not null" | sort > /tmp/prd-migrations.txt
          PENDING=$(comm -23 /tmp/repo-migrations.txt /tmp/prd-migrations.txt)
          if [ -n "$PENDING" ]; then
            echo "::error::PRD tiene migraciones Prisma SIN aplicar:"
            echo "$PENDING"
            echo "Aplicar: source .env.local.nube-backup && cd packages/db && pnpm exec prisma migrate deploy"
            exit 1
          fi
          echo "✓ PRD al día ($(wc -l < /tmp/prd-migrations.txt) migraciones aplicadas)"
          LIFECYCLE_CRON=$(psql "$BACKUP_DATABASE_URL" -tAc "select count(*) = 1 from cron.job where jobname = 'lucams-lifecycle' and active and schedule = '*/15 * * * *'")
          if [ "$LIFECYCLE_CRON" != "t" ]; then
            echo "::error::PRD debe tener un cron lucams-lifecycle activo cada 15 minutos"
            echo "Aplicar tras un deploy Ready: psql \"\$BACKUP_DATABASE_URL\" -v ON_ERROR_STOP=1 -f supabase/migrations/00000000000058_pgcron_lifecycle.sql"
            exit 1
          fi
          echo "✓ lucams-lifecycle activo (*/15 * * * *)"
