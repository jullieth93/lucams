name: Post-deploy smoke (PRD)

# F-08 (auditoría 2026-09-26, remediación R3): smoke post-deploy AUTOMATIZADO.
# Antes la verificación post-deploy de PRD era un spec manual — un deploy "verde"
# con una capacidad rota podía durar 10-20 min hasta que el monitor externo la
# viera. Este workflow sondea los health endpoints públicos + 2 journeys
# read-only (homepage, catálogo) y sale ROJO si algo no responde 200.
#
# Triggers:
#   - workflow_run del CI sobre `production`: el push a production dispara el
#     deploy de Vercel y el CI a la vez; el CI tarda más que el build de Vercel,
#     así que al completar el CI el deploy ya está (o casi) servido — el script
#     tolera la propagación con reintentos. NO existe workflow de deploy propio
#     (Vercel despliega por integración Git, sin workflow_run de deployment), así
#     que el cierre del CI sobre production es el proxy más fiel disponible.
#   - schedule ligero (2 veces por hora): segunda red independiente del monitor
#     de STG (A9-12 — si STG está pausado no hay sondeo externo; este vive en
#     GitHub). Getters públicos, costo cero.
#   - workflow_dispatch: verificación manual post-hotfix.
#
# NO usa secrets: todo es GET público read-only (los health endpoints son
# públicos a propósito; el detalle sensible de /api/health/crons exige
# x-cron-secret y acá NO se pide — solo el status agregado).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [production]
  schedule:
    # Minutos 7 y 37 de cada hora (fuera de las marcas :00/:30 de la manada).
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false # un smoke a medias no se cancela: su resultado importa

jobs:
  smoke:
    name: Health endpoints + journeys read-only de PRD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Sin pnpm install ni build: el script es Node 22 pelado (fetch nativo),
      # cero dependencias — el smoke no debe depender del toolchain del repo.
      - name: Smoke post-deploy (health + homepage + catálogo)
        run: node apps/web/scripts/post-deploy-smoke.mjs
        env:
          SMOKE_BASE_URL: https://lucamsshop.com

      # Deriva de schema (2026-10-20 — incidente real: 4 migraciones Prisma quedaron
      # sin aplicar en PRD tras un release y el cron cart-recovery reventó 2h después
      # con "column does not exist"; el smoke de rutas no lo veía). Compara las
      # migraciones del repo contra `_prisma_migrations` de PRD con psql pelado
      # (preinstalado en ubuntu-latest) y falla ROJO si hay pendientes — el release
      # correcto corre `prisma migrate deploy` ANTES del merge (docs/OPERATIONS.md).
      # Reusa el secret del backup diario; si falta, se salta con warning (mismo
      # patrón fail-visible de backup.yml).
      - name: Migraciones Prisma pendientes en PRD (drift check)
        env:
          HAS_DB: ${{ secrets.BACKUP_DATABASE_URL != '' }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ "$HAS_DB" != "true" ]; then
            echo "::warning::Drift check inactivo: falta el secret BACKUP_DATABASE_URL"
            exit 0
          fi
          ls packages/db/prisma/migrations | grep -E '^[0-9]{14}_' | sort > /tmp/repo-migrations.txt
          psql "$BACKUP_DATABASE_URL" -tAc "select migration_name from _prisma_migrations where finished_at is not null" | sort > /tmp/prd-migrations.txt
          PENDING=$(comm -23 /tmp/repo-migrations.txt /tmp/prd-migrations.txt)
          if [ -n "$PENDING" ]; then
            echo "::error::PRD tiene migraciones Prisma SIN aplicar:"
            echo "$PENDING"
            echo "Aplicar: source .env.local.nube-backup && cd packages/db && pnpm exec prisma migrate deploy"
            exit 1
          fi
          echo "✓ PRD al día ($(wc -l < /tmp/prd-migrations.txt) migraciones aplicadas)"
