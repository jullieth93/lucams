name: Nightly — tests que necesitan Supabase real

# Auditoría 2026-07-13: los tests que exigen un stack Supabase REAL (GoTrue + PostgREST) se saltan
# en el CI por-PR (Postgres pelado): rls-matrix de COMPORTAMIENTO (¿una policy aísla datos de
# verdad?) y los E2E de admin-login/MFA/Estudio (crean usuarios vía service role → necesitan
# GoTrue). Este workflow los corre de forma NOCTURNA + on-demand. NO es per-PR a propósito:
# no bloquea PRs, complementa el gate por-PR.
#
# A3 (2026-07-31, decisión del usuario): el "Supabase real" es el stack LOCAL de Supabase
# levantado en el propio runner (`supabase start` — Postgres + GoTrue + Storage + PostgREST +
# pg_cron, que además aplica supabase/migrations/* al boot). Ya NO hace falta un proyecto
# externo ni secrets STAGING_*: cada corrida es efímera, aislada y reproducible, y el riesgo
# "dev/prod comparten proyecto" queda fuera de CI. Las credenciales del stack local son
# deterministas de desarrollo (documentadas por Supabase — no son secretos reales).
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC (~01:00 America/Bogotá)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.0.9"

jobs:
  # Tests de integración que exigen Supabase real (rls-matrix de comportamiento + storage real) —
  # el resto del suite ya corre en el gate por-PR contra Postgres pelado.
  vitest-supabase-real:
    name: Vitest contra Supabase local (rls-matrix de comportamiento)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CSRF_SECRET: nightly-csrf-secret-32-chars-minimo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lucams/db db:generate
      - uses: supabase/setup-cli@v1
      # El start corre desde .github/ci/localstack (workdir pelado SIN
      # migrations — ver su config.toml): el stack arranca sin auto-aplicar
      # nada y el orden correcto queda en manos del workflow (prisma → psql).
      - name: Levantar Supabase local y exportar credenciales
        working-directory: .github/ci/localstack
        run: |
          supabase start
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "DIRECT_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d'\"' -f2)"
            echo "SUPABASE_SECRET_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d'\"' -f2)"
          } >> "$GITHUB_ENV"
      - name: Extensiones Postgres prerequisito (pg_trgm/unaccent — las exigen migraciones viejas)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/localstack/prereq-extensions.sql
      - name: Aplicar migraciones Prisma
        run: pnpm --filter @lucams/db exec prisma migrate deploy
      - name: Aplicar migraciones SQL de Supabase (RLS, storage, pg_cron)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      # Corre TODO el vitest: con las llaves reales, rls-matrix y los tests de
      # storage (que se saltan en el gate por-PR) ahora SÍ ejecutan.
      - name: Vitest (incl. rls-matrix de comportamiento)
        run: pnpm --filter web test

  e2e-supabase-real:
    name: E2E completo (admin-login + MFA + Estudio) contra Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WA_NUMBER: "573208873826"
      CSRF_SECRET: nightly-csrf-secret-32-chars-minimo
      # Smoke LIVE de Wompi (ADR-067): si se cargan los WOMPI_* SANDBOX como GitHub Secrets, el
      # nightly los usa y corre el smoke contra la API real de sandbox; si no, cae al dummy y el
      # smoke se salta (skipIf). Los tests mockeados pasan en ambos casos. NUNCA usar keys de prod.
      WOMPI_ENV: sandbox
      WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY || 'pub_test_ci' }}
      WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY || 'prv_test_ci' }}
      WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET || 'test_integrity_ci' }}
      WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET || 'test_events_ci' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lucams/db db:generate
      - uses: supabase/setup-cli@v1
      - name: Levantar Supabase local y exportar credenciales
        working-directory: .github/ci/localstack
        run: |
          supabase start
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "DIRECT_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d'\"' -f2)"
            echo "SUPABASE_SECRET_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d'\"' -f2)"
          } >> "$GITHUB_ENV"
      - name: Extensiones Postgres prerequisito (pg_trgm/unaccent — las exigen migraciones viejas)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/localstack/prereq-extensions.sql
      - name: Aplicar migraciones Prisma
        run: pnpm --filter @lucams/db exec prisma migrate deploy
      - name: Aplicar migraciones SQL de Supabase (RLS, storage, pg_cron)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Seed del catálogo (productos para PDP/carrito/estudio)
        run: pnpm --filter @lucams/db exec node scripts/seed-catalog-v2.mjs
      - name: Seed del CMS v2 (estructura páginas/secciones/campos para el admin)
        run: pnpm --filter @lucams/db exec node scripts/migrate-cms-v2.mjs
      - name: Instalar navegador Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build de producción (next start del webServer)
        run: pnpm --filter web build
      # Suite COMPLETA: incluye admin-login + admin-mfa + estudio (los que necesitan GoTrue real y
      # por eso NO corren en el gate por-PR). Excluye 'visual' (baselines por-píxel).
      - name: Playwright (completo, incl. admin/MFA/Estudio)
        run: pnpm --filter web exec playwright test smoke a11y axe compra admin-login admin-mfa estudio --project=chromium
      - name: Subir reporte Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: apps/web/playwright-report/
