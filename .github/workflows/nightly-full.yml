name: Nightly — tests que necesitan Supabase real

# Corre de forma NOCTURNA + on-demand los tests que exigen un stack Supabase REAL
# (GoTrue + PostgREST + Storage + Mailpit) o sandbox externo (Wompi/Aveonline),
# levantando el stack local efímero (`supabase start`) dentro del runner.
#
# Optimización 2026-11-03:
#   - Guard de actividad (`gate-activity`): en corridas `schedule`, si no hubo
#     commits en las últimas 24 h, salta limpio sin levantar los 3 stacks Docker
#     sobre el mismo SHA ya certificado la noche previa. En `workflow_dispatch`
#     corre SIEMPRE (gate de certificación de release).
#   - `vitest-supabase-real`: corre SOLO las 6 suites que exigen GoTrue/Storage
#     real o sandbox Wompi (el resto de los ~3.100 tests + `rls-matrix` ya corren
#     en cada PR en `ci.yml`).
#   - `e2e-supabase-real`: corre SOLO los 7 specs exclusivos de GoTrue/Mailpit/
#     admin/homolog + el smoke cross-browser Firefox/WebKit (los 5 specs públicos
#     `smoke`, `a11y`, `axe`, `compra` y `estudio` ya corren en cada PR).
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC (~01:00 America/Bogotá)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.0.9"

jobs:
  gate-activity:
    name: ¿Hubo cambios en las últimas 24 h?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 5

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Disparo manual (workflow_dispatch) → suite nocturna completa."
            exit 0
          fi
          RECENT=$(git log -1 --since="24 hours ago" --format=%H)
          if [ -n "$RECENT" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Commits recientes detectados ($RECENT) → ejecutando suite nocturna."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin commits nuevos en las últimas 24 h — se omite la corrida nocturna redundante."
          fi

  vitest-supabase-real:
    name: Vitest contra Supabase local (GoTrue + Storage real)
    needs: gate-activity
    if: needs.gate-activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CSRF_SECRET: nightly-csrf-secret-32-chars-minimo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3
        with:
          version: 2.111.0
      - name: Levantar Supabase local y exportar credenciales
        working-directory: .github/ci/localstack
        run: |
          supabase start
          supabase status -o env | tee sb-status.env
          ANON=$(grep -E '^(ANON_KEY|PUBLISHABLE_KEY|SUPABASE_ANON_KEY)=' sb-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          SERVICE=$(grep -E '^(SERVICE_ROLE_KEY|SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY)=' sb-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          if [ -z "$ANON" ] || [ -z "$SERVICE" ]; then
            echo "::error::No se pudieron extraer las keys del stack local (ver sb-status.env arriba)."
            exit 1
          fi
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "DIRECT_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "SUPABASE_ADMIN_URL=postgresql://supabase_admin:postgres@localhost:54322/postgres"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON"
            echo "SUPABASE_SECRET_KEY=$SERVICE"
          } >> "$GITHUB_ENV"
      - name: Extensiones Postgres prerequisito (pg_trgm/unaccent — las exigen migraciones viejas)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/localstack/prereq-extensions.sql
      - name: Aplicar migraciones Prisma
        run: pnpm --filter @lucams/db exec prisma migrate deploy
      - name: Aplicar migraciones SQL de Supabase (RLS, storage, pg_cron)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$SUPABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Vitest (suites exclusivas de GoTrue/Storage real + Wompi sandbox)
        run: >-
          pnpm --filter web exec vitest run
          "app/(auth)/auth-actions.integration.test.ts"
          "features/personalization/finalize-server-render.integration.test.ts"
          "features/personalization/service.integration.test.ts"
          "features/personalization/letter-tiles.integration.test.ts"
          "features/personalization/retention-service.integration.test.ts"
          "lib/wompi.live.test.ts"

  e2e-supabase-real:
    name: E2E completo (admin-login + MFA + auth + CMS + cross-browser)
    needs: gate-activity
    if: needs.gate-activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WA_NUMBER: "573208873826"
      CSRF_SECRET: nightly-csrf-secret-32-chars-minimo
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      WOMPI_ENV: sandbox
      WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY || 'pub_test_ci' }}
      WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY || 'prv_test_ci' }}
      WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET || 'test_integrity_ci' }}
      WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET || 'test_events_ci' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3
        with:
          version: 2.111.0
      - name: Levantar Supabase local y exportar credenciales
        working-directory: .github/ci/localstack
        run: |
          supabase start
          supabase status -o env | tee sb-status.env
          ANON=$(grep -E '^(ANON_KEY|PUBLISHABLE_KEY|SUPABASE_ANON_KEY)=' sb-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          SERVICE=$(grep -E '^(SERVICE_ROLE_KEY|SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY)=' sb-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          if [ -z "$ANON" ] || [ -z "$SERVICE" ]; then
            echo "::error::No se pudieron extraer las keys del stack local (ver sb-status.env arriba)."
            exit 1
          fi
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "DIRECT_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "SUPABASE_ADMIN_URL=postgresql://supabase_admin:postgres@localhost:54322/postgres"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON"
            echo "SUPABASE_SECRET_KEY=$SERVICE"
          } >> "$GITHUB_ENV"
      - name: Extensiones Postgres prerequisito (pg_trgm/unaccent — las exigen migraciones viejas)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/localstack/prereq-extensions.sql
      - name: Aplicar migraciones Prisma
        run: pnpm --filter @lucams/db exec prisma migrate deploy
      - name: Aplicar migraciones SQL de Supabase (RLS, storage, pg_cron)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$SUPABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Seed del catálogo CANÓNICO (base que el delta v2 exige)
        run: pnpm --filter @lucams/db exec node scripts/seed-catalog-canonical.mjs --apply
      - name: Seed de ocasiones (prerrequisito de los links del delta v2)
        run: pnpm --filter @lucams/db exec node scripts/seed-ocasiones.mjs --apply
      - name: Seed del catálogo (productos para PDP/carrito/estudio)
        run: pnpm --filter @lucams/db exec node scripts/seed-catalog-v2.mjs --apply
      - name: Seed del CMS v2 (estructura páginas/secciones/campos para el admin)
        run: pnpm --filter @lucams/db exec node scripts/migrate-cms-v2.mjs --apply
      - name: Instalar navegadores Playwright (Chromium + Firefox + WebKit)
        run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit
      - name: Build de producción (next start del webServer)
        run: pnpm --filter web build
      - name: "Playwright (exclusivos de Supabase real: admin/MFA/CMS/auth/retracto)"
        run: pnpm --filter web exec playwright test admin-login.spec admin-mfa.spec admin-help.spec cms-editing-flow.spec responsive-admin-audit.spec audit-cliente.spec homolog-auth.spec retracto-garantia-cliente.spec --project=desktop-chrome
      - name: Cross-browser smoke (Firefox + WebKit, read-only)
        run: pnpm --filter web exec playwright test --project=desktop-firefox --project=desktop-webkit
      - name: Subir reporte Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-nightly
          path: |
            apps/web/playwright-report/
            /tmp/audit-cliente.json
            /tmp/audit-cliente-*.png

  gate-wompi-sandbox:
    name: ¿Secrets sandbox Wompi/Aveonline configurados?
    needs: gate-activity
    if: needs.gate-activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          HAS_WOMPI: ${{ secrets.WOMPI_PUBLIC_KEY != '' && secrets.WOMPI_PRIVATE_KEY != '' && secrets.WOMPI_INTEGRITY_SECRET != '' && secrets.WOMPI_EVENTS_SECRET != '' }}
          HAS_AVEONLINE: ${{ secrets.AVEONLINE_USUARIO != '' && secrets.AVEONLINE_CLAVE != '' }}
        run: |
          if [ "$HAS_WOMPI" = "true" ] && [ "$HAS_AVEONLINE" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E de dinero (wompi-sandbox) INACTIVO: faltan secrets sandbox (WOMPI_PUBLIC_KEY/WOMPI_PRIVATE_KEY/WOMPI_INTEGRITY_SECRET/WOMPI_EVENTS_SECRET y/o AVEONLINE_USUARIO/AVEONLINE_CLAVE). Es GATE DE RELEASE: sin este job verde, la certificación exige la corrida manual documentada en docs/TESTING.md."
          fi

  e2e-wompi-sandbox:
    name: E2E dinero — checkout Wompi sandbox (4242 → PAID + guía)
    needs: [gate-activity, gate-wompi-sandbox]
    if: needs.gate-wompi-sandbox.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:4000
      NEXT_PUBLIC_WA_NUMBER: "573208873826"
      NEXT_PUBLIC_STORE_MODE: full
      CSRF_SECRET: nightly-csrf-secret-32-chars-minimo
      WOMPI_ENV: sandbox
      WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
      WOMPI_PRIVATE_KEY: ${{ secrets.WOMPI_PRIVATE_KEY }}
      WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
      WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET }}
      AVEONLINE_USUARIO: ${{ secrets.AVEONLINE_USUARIO }}
      AVEONLINE_CLAVE: ${{ secrets.AVEONLINE_CLAVE }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      PW_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3
        with:
          version: 2.111.0
      - name: Levantar Supabase local y exportar credenciales
        working-directory: .github/ci/localstack
        run: |
          supabase start
          supabase status -o env | tee sb-status.env
          ANON=$(grep -E '^(ANON_KEY|PUBLISHABLE_KEY|SUPABASE_ANON_KEY)=' sb-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          SERVICE=$(grep -E '^(SERVICE_ROLE_KEY|SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY)=' sb-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          if [ -z "$ANON" ] || [ -z "$SERVICE" ]; then
            echo "::error::No se pudieron extraer las keys del stack local (ver sb-status.env arriba)."
            exit 1
          fi
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "DIRECT_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "SUPABASE_ADMIN_URL=postgresql://supabase_admin:postgres@localhost:54322/postgres"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON"
            echo "SUPABASE_SECRET_KEY=$SERVICE"
          } >> "$GITHUB_ENV"
      - name: Extensiones Postgres prerequisito (pg_trgm/unaccent — las exigen migraciones viejas)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/localstack/prereq-extensions.sql
      - name: Aplicar migraciones Prisma
        run: pnpm --filter @lucams/db exec prisma migrate deploy
      - name: Aplicar migraciones SQL de Supabase (RLS, storage, pg_cron)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$SUPABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Seed del catálogo (contexto de storefront para el checkout)
        run: pnpm --filter @lucams/db exec node scripts/seed-catalog-v2.mjs --apply
      - name: Instalar navegador Playwright (chromium completo + deps)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build de producción (next start del webServer)
        run: pnpm --filter web build
      - name: Playwright (wompi-sandbox — journey de dinero completo)
        run: pnpm --filter web exec playwright test wompi-sandbox.spec --project=desktop-chrome
      - name: Subir evidencia del journey de dinero
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wompi-sandbox-evidence
          path: |
            apps/web/playwright-report/
            /tmp/e2e-tx-*.png
            /tmp/wompi-hosted-filled.png
          retention-days: 30
