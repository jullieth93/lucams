name: Uptime monitor (healthchecks PRD)

# Monitor EXTERNO de disponibilidad SIN SaaS (punto 4, 2026-09-13).
#
# Por qué existe: el usuario rechazó los monitores SaaS gratuitos (UptimeRobot /
# BetterStack) — no se quiere un producto externo más. Este workflow corre los
# mismos probes contra PRODUCCIÓN desde los runners de GitHub (fuera de Vercel
# y de Supabase) y FALLA si alguno no responde 2xx → GitHub envía la notificación
# por email (el MISMO canal que ya funciona para backup.yml: fallo de workflow
# programado → correo al dueño del repo).
#
# Qué cubre (el ciego CF-22 de la auditoría 360°):
#   - Caída de VERCEL o del dominio (los 5 endpoints dejan de responder).
#   - Caída del PROPIO sistema de alertas: /api/health/crons es un dead-man
#     switch 503 si algún cron pg_cron lleva 2× su intervalo sin latido — la
#     capa interna de evaluateAlerts no puede detectar su propia muerte.
#   - Probes REALES de integraciones caídas: Wompi (/merchants), Resend
#     (/domains) y Aveonline responden 503/500 si el tercero o las llaves fallan
#     — /api/health/all solo degrada por DB/storage, así que estas tres se
#     poleen INDIVIDUALMENTE (en /all son no-bloqueantes).
#   - DB y storage (Supabase) vía el agregador /api/health/all (503 si crítico).
#
# Qué NO cubre (honestidad de diseño):
#   - "skipped" (integración sin llaves → 200 por diseño: modo catálogo) y
#     "warn" (p.ej. remitente Resend mal configurado → 200) no alertan acá;
#     ambos estados ya son visibles en /admin/observability.
#   - El runner de GitHub puede tener su propio blip de red: por eso hay UN
#     retry tras 60 s antes de fallar (anti falsos positivos transitorios).
#
# Limitaciones conocidas de GitHub Actions:
#   - Los schedules se auto-DESHABILITAN tras 60 días de inactividad del repo.
#     Contramedida: este repo tiene actividad a diario (commits/CI); si alguna
#     vez se deshabilita, GitHub avisa por email y se reactiva con un click.
#   - El cron de GitHub no es exacto (colas de hasta ~15 min en horas pico):
#     para un monitor de 30 min es tolerancia aceptable.
#
# Consumo estimado: 2 ejecuciones/hora × ~1 min ≈ 1 450 min/mes de Actions
# (dentro del gratis de repos privados; peor caso con retry ≈ +1 min).
on:
  schedule:
    # Cada 30 min, FUERA del minuto 0/30 de rebaño (los cron de GitHub corren en UTC).
    - cron: "13,43 * * * *"
  workflow_dispatch: {} # permite dispararlo manualmente desde la pestaña Actions

# Least privilege: el job no hace checkout ni toca el repo (solo curl a PRD).
permissions:
  contents: read

concurrency:
  group: uptime-monitor
  cancel-in-progress: true # un probe viejo no aporta: lo reemplaza el nuevo

jobs:
  probe:
    name: Probes HTTPS a lucamsshop.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Healthchecks con retry (1 reintento tras 60 s)
        env:
          BASE_URL: https://lucamsshop.com
        run: |
          set -u
          ENDPOINTS=(
            /api/health/all
            /api/health/crons
            /api/health/resend
            /api/health/wompi
            /api/health/aveonline
          )

          # Probe de una ronda: imprime el resultado por endpoint y deja en
          # FAILED los que NO devolvieron 2xx (--fail marca HTTP>=400; un
          # timeout/DNS deja http_code=000, también no-2xx → cuenta como fallo).
          FAILED=()
          probe_round() {
            FAILED=()
            for path in "${ENDPOINTS[@]}"; do
              # `--fail` NO vuelca el body en HTTP>=400 (fail silently): sin
              # truncar antes, el log mostraría el body STALE del probe anterior.
              : > /tmp/health-body.txt
              # `--fail` marca HTTP>=400; timeout/DNS deja http_code=000. Ambos
              # casos son no-2xx → cuentan como fallo. Sin `|| echo`: queremos
              # el código real que imprime -w (no hay set -e, no aborta).
              code=$(curl --fail -sS -o /tmp/health-body.txt -w "%{http_code}" \
                --max-time 20 "$BASE_URL$path")
              if [[ "$code" =~ ^2 ]]; then
                echo "OK   $path (HTTP $code)"
              else
                echo "FAIL $path (HTTP $code) — $(head -c 200 /tmp/health-body.txt 2>/dev/null)"
                FAILED+=("$path")
              fi
            done
          }

          echo "== Ronda 1 — $(date -u +%FT%TZ) =="
          probe_round

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::warning::${#FAILED[@]} endpoint(s) fallaron: ${FAILED[*]} — reintentando en 60 s (anti falsos positivos transitorios)."
            sleep 60
            echo "== Ronda 2 (retry) — $(date -u +%FT%TZ) =="
            RETRY_TARGETS=("${FAILED[@]}")
            ENDPOINTS=("${RETRY_TARGETS[@]}")
            probe_round
          fi

          if [ "${#FAILED[@]}" -gt 0 ]; then
            for path in "${FAILED[@]}"; do
              echo "::error::$BASE_URL$path sigue sin responder 2xx tras el retry."
            done
            echo "Fallo del monitor externo: GitHub notificará este workflow por email."
            exit 1
          fi
          echo "Todos los healthchecks OK."
