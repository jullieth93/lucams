name: CI

# Ramas protegidas del repo (`develop` y `production`; `main` NO existe — ver
# docs/OPERATIONS.md § Estrategia de ramas y releases).
#
# Optimización 2026-11-03:
#   - Sin trigger `push`: el ruleset `protect-ramas-criticas` bloquea pushes
#     directos a `develop` y `production` (`bypass_actors: []`) y exige rama al
#     día (`strict: true`), así que todo cambio entra por `pull_request` con el
#     árbol final ya certificado. Quitar `push` baja el ciclo feature→release de
#     4 corridas a 2 y elimina los checks duplicados en PRs de release.
#   - `workflow_dispatch` permite disparar el CI completo bajo demanda en
#     cualquier rama.
#   - Fast-path fail-closed para PRs solo-documentación (`docs/**`, `README.md`,
#     `CLAUDE.md`, `AGENTS.md`): valida `gitleaks` + `prettier --check` +
#     `pnpm audit --prod` en ~30 s sin levantar Postgres, Supabase Docker,
#     Playwright ni `next build`. `packages/db/legal-content/*.md` NO entra en
#     docs-only porque es contenido servido al cliente.
#   - Consolidación de VMs: `format:check` y `pnpm audit --prod` corren dentro
#     de `quality`; Lighthouse (desktop + móvil) reutiliza el build y Postgres
#     seedeado del job `e2e` (ahorra 3 VMs y 1 `next build` por corrida).
on:
  pull_request:
    branches: [develop, production]
  workflow_dispatch: {}

# Cancela runs anteriores del mismo PR/branch si llega uno nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: el GITHUB_TOKEN solo necesita leer el repo (Bloque C / S5).
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.0.9"
  # Variables placeholder para que Next.js compile sin errores en CI
  # (sin tocar la DB real). El typecheck no requiere conexión.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
  SUPABASE_SECRET_KEY: placeholder
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/postgres
  DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/postgres
  NEXT_PUBLIC_WA_NUMBER: "573208873826"
  CSRF_SECRET: placeholder-csrf-secret-32-chars-min
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Detectar alcance (código vs solo docs)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: detect
        run: |
          # Fail-closed: ante cualquier duda (workflow_dispatch, diff vacío o ruta
          # fuera del allowlist documental), corre el suite completo (`docs_only=false`).
          DOCS_ONLY="false"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" || true)
            if [ -n "$FILES" ] && ! echo "$FILES" | grep -qvE '^(docs/|README\.md$|CLAUDE\.md$|AGENTS\.md$|apps/web/(README|AGENTS|CLAUDE)\.md$|apps/web/.*/README\.md$)'; then
              DOCS_ONLY="true"
              echo "Fast-path documental activado (archivos: $(echo "$FILES" | tr '\n' ' '))"
            fi
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

  secrets-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # En eventos pull_request gitleaks-action lista los commits del PR vía API
    # (`pulls/<n>/commits`); requiere `pull-requests: read` en este job.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Typecheck + Lint + Build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Corren SIEMPRE (incluso en PRs solo-docs: prettier valida también **/*.md).
      - name: Prettier format check
        run: pnpm format:check

      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm -r typecheck

      - name: Lint
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm -r lint

      # Gate de paridad exacta CMS v2 (ADR-082/187 — modelo de 3 capas):
      # verifica por AST que toda clave CMS leída en apps/web exista en
      # packages/db/scripts/cms-site-map.mjs y que ningún campo quede huérfano.
      - name: Paridad exacta CMS v2 (código ↔ cms-site-map.mjs)
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm --filter web exec vitest run lib/cms-sitemap-parity.test.ts

      # Lint de guards (N-06, 2026-09-12): todo script de packages/db/scripts que
      # escribe en DB debe importar lib/env-guard.mjs (fail-closed).
      - name: Lint de guards en scripts de DB (N-06)
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm --filter @lucams/db exec node scripts/lib/check-script-guards.mjs

      # Tests unitarios de los propios guards (A10-06, remediación R3 2026-09-26).
      - name: Tests de guards de scripts DB (env-guard, node --test)
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm --filter @lucams/db test

      # Guard es-CO: el copy debe ser TUTEO, nunca voseo (mandato de idioma).
      - name: Lint de voseo (es-CO tuteo)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          if grep -rniE '\b(para vos|a vos|con vos|tenés|podés|querés|hacés|respondé|escribinos|mandanos|elegí|contá|contanos|contás|usás|generá|creá|marcá|completá|dejala|registrate|corré|ingresá|revisá|configurá|seleccioná)\b' \
               apps/web packages/db/scripts \
               --include='*.ts' --include='*.tsx' --include='*.mjs' \
             | grep -vE '\.test\.|\.integration\.|fix-voseo|check-voseo'; then
            echo "::error::Se encontró VOSEO en el copy. El mandato es TUTEO es-CO (ej. 'elige' no 'elegí', 'para ti' no 'para vos')."
            exit 1
          fi
          echo "OK: sin voseo."

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm --filter web build

  unit-tests:
    name: Vitest tests (unit + integración con Postgres)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lucams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lucams_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lucams_test
      WOMPI_ENV: sandbox
      WOMPI_PUBLIC_KEY: pub_test_ci
      WOMPI_PRIVATE_KEY: prv_test_ci
      WOMPI_INTEGRITY_SECRET: test_integrity_ci
      WOMPI_EVENTS_SECRET: test_events_ci
      # Vacío → los tests que exigen GoTrue/Storage real saltan limpio (corren en
      # rls-behavior y en nightly-full.yml).
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compat de Supabase (roles + extensiones + stubs auth/storage)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/supabase-compat.sql

      - name: Aplicar migraciones Prisma (schema desde cero)
        run: pnpm --filter @lucams/db exec prisma migrate deploy

      # A9-08 (remediación R3 2026-09-26): drift check Prisma ↔ Supabase.
      - name: Snapshot del schema post-Prisma (drift check)
        run: pnpm --filter @lucams/db exec node scripts/audit-schema-drift.mjs snapshot --out "$RUNNER_TEMP/schema-post-prisma.json"

      - name: Aplicar migraciones SQL de Supabase (RLS, funciones)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Drift check Prisma ↔ Supabase (A9-08)
        run: pnpm --filter @lucams/db exec node scripts/audit-schema-drift.mjs check --baseline "$RUNNER_TEMP/schema-post-prisma.json"

      - name: Run vitest (unit + integración) + gate de cobertura
        run: pnpm --filter web test:coverage

  rls-behavior:
    name: RLS behavior (rls-matrix contra Supabase local)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CSRF_SECRET: ci-rls-csrf-secret-32-chars-minimo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3
        with:
          version: 2.111.0

      - name: Levantar Supabase local y exportar credenciales
        working-directory: .github/ci/localstack
        run: |
          supabase start
          supabase status -o env | tee sb-status.env
          ANON=$(grep -E '^(ANON_KEY|PUBLISHABLE_KEY|SUPABASE_ANON_KEY)=' sb-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          SERVICE=$(grep -E '^(SERVICE_ROLE_KEY|SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY)=' sb-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          if [ -z "$ANON" ] || [ -z "$SERVICE" ]; then
            echo "::error::No se pudieron extraer las keys del stack local (ver sb-status.env arriba)."
            exit 1
          fi
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "DIRECT_URL=postgresql://postgres:postgres@localhost:54322/postgres"
            echo "SUPABASE_ADMIN_URL=postgresql://supabase_admin:postgres@localhost:54322/postgres"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON"
            echo "SUPABASE_SECRET_KEY=$SERVICE"
          } >> "$GITHUB_ENV"

      - name: Extensiones Postgres prerequisito (pg_trgm/unaccent — las exigen migraciones viejas)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/localstack/prereq-extensions.sql

      - name: Aplicar migraciones Prisma
        run: pnpm --filter @lucams/db exec prisma migrate deploy

      - name: Aplicar migraciones SQL de Supabase (RLS, storage, pg_cron)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$SUPABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Vitest RLS (rls-coverage + rls-matrix de comportamiento)
        run: pnpm --filter web exec vitest run features/security/rls-coverage.integration.test.ts features/security/rls-matrix.integration.test.ts

  e2e:
    name: E2E + a11y + Lighthouse — Playwright
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Unifica Playwright (smoke + a11y + axe + compra + estudio + responsive) y
    # Lighthouse (desktop + móvil — ADR-066) sobre el MISMO Postgres seedeado y
    # el MISMO build de producción (`next build`), eliminando 1 VM, 47 migraciones
    # SQL repetidas y 1 compilación completa de Next.js en cada PR.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lucams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lucams_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lucams_test
      WOMPI_ENV: sandbox
      WOMPI_PUBLIC_KEY: pub_test_ci
      WOMPI_PRIVATE_KEY: prv_test_ci
      WOMPI_INTEGRITY_SECRET: test_integrity_ci
      WOMPI_EVENTS_SECRET: test_events_ci
      PORT: "4000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compat de Supabase (roles + extensiones + stubs auth/storage)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/supabase-compat.sql

      - name: Aplicar migraciones Prisma (schema desde cero)
        run: pnpm --filter @lucams/db exec prisma migrate deploy

      - name: Aplicar migraciones SQL de Supabase (RLS, funciones)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed del catálogo (productos para PDP/carrito/estudio/Lighthouse)
        run: pnpm --filter @lucams/db exec node scripts/seed-catalog-v2.mjs --apply

      - name: Instalar navegador Playwright (chromium + deps)
        run: |
          for i in 1 2 3 4; do
            if pnpm --filter web exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install falló (intento $i/4) — reintentando tras apt-get update"
            sudo apt-get update || true
            sleep 15
          done
          echo "::error::playwright install falló tras 4 intentos"
          exit 1

      - name: Build de producción (compartido por Playwright y Lighthouse)
        run: pnpm --filter web build

      - name: Playwright (smoke + a11y + axe + compra + estudio + gate responsive)
        run: pnpm --filter web exec playwright test smoke.spec a11y.spec axe.spec compra.spec estudio.spec mobile-storefront-audit.spec --project=desktop-chrome

      - name: Lighthouse CI desktop (ADR-066 — home + catálogo)
        run: |
          fuser -k 4000/tcp 2>/dev/null || true
          pnpm lhci

      - name: Lighthouse CI móvil (ADR-066 — home + catálogo)
        run: |
          fuser -k 4000/tcp 2>/dev/null || true
          pnpm lhci:mobile

      - name: Subir reportes Playwright / Lighthouse (si falla)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-lighthouse-reports
          path: |
            apps/web/playwright-report/
            .lighthouseci/
          retention-days: 7
