name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancela runs anteriores del mismo PR/branch si llega uno nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: el GITHUB_TOKEN solo necesita leer el repo (Bloque C / S5).
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.0.9"
  # Variables placeholder para que Next.js compile sin errores en CI
  # (sin tocar la DB real). El typecheck no requiere conexión.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
  SUPABASE_SECRET_KEY: placeholder
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/postgres
  DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/postgres
  NEXT_PUBLIC_WA_NUMBER: "573208873826"
  CSRF_SECRET: placeholder-csrf-secret-32-chars-min
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lucams/db db:generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      # Guard es-CO: el copy debe ser TUTEO, nunca voseo (mandato de idioma). Falla si
      # aparece cualquier token de voseo en el código fuente (excluye tests y los scripts
      # que justamente corrigen voseo).
      - name: Lint de voseo (es-CO tuteo)
        run: |
          if grep -rniE '\b(para vos|a vos|con vos|tenés|podés|querés|hacés|elegí|contá|contanos|contás|usás|generá|creá|marcá|completá|dejala|registrate|corré|ingresá|revisá|configurá|seleccioná)\b' \
               apps/web packages/db/scripts \
               --include='*.ts' --include='*.tsx' --include='*.mjs' \
             | grep -vE '\.test\.|\.integration\.|fix-voseo|check-voseo'; then
            echo "::error::Se encontró VOSEO en el copy. El mandato es TUTEO es-CO (ej. 'elige' no 'elegí', 'para ti' no 'para vos')."
            exit 1
          fi
          echo "OK: sin voseo."

      - name: Build
        run: pnpm --filter web build

  unit-tests:
    name: Vitest tests (unit + integración con Postgres)
    runs-on: ubuntu-latest
    # 15 min: la instrumentación de cobertura (v8) añade overhead sobre el run normal.
    timeout-minutes: 15
    # Postgres real (service container) → los ~1.400 tests, incl. integración con DB,
    # corren y se ENFORCEAN en CI. Conexión directa (sin pooler) → rápido y sin flakiness.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lucams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DB del service (sobreescribe los placeholders globales).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lucams_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lucams_test
      # Dummies de Wompi: finalizeCheckout construye el provider; los tests mockean la API real.
      WOMPI_ENV: sandbox
      WOMPI_PUBLIC_KEY: pub_test_ci
      WOMPI_PRIVATE_KEY: prv_test_ci
      WOMPI_INTEGRITY_SECRET: test_integrity_ci
      WOMPI_EVENTS_SECRET: test_events_ci
      # Vacío → los tests que exigen el stack Supabase REAL (R3 rls-matrix, que pega a
      # PostgREST/GoTrue) saltan limpio. El resto usa Prisma contra el service o mockea supabase.
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lucams/db db:generate

      - name: Compat de Supabase (roles + extensiones + stubs auth/storage)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/supabase-compat.sql

      - name: Aplicar migraciones Prisma (schema desde cero)
        run: pnpm --filter @lucams/db exec prisma migrate deploy

      - name: Aplicar migraciones SQL de Supabase (RLS, funciones)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run vitest (unit + integración) + gate de cobertura
        # test:coverage = vitest run --coverage. Los thresholds de vitest.config.ts
        # (lines/statements/functions/branches) fallan el job si la cobertura cae por
        # debajo del piso → gate de regresión. text-summary imprime el % en el log.
        run: pnpm --filter web test:coverage

  e2e:
    name: E2E + a11y (axe WCAG) — Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Gatea en CADA PR los flujos anónimos (antes existían pero NO corrían en CI → una
    # regresión de compra, de contraste AA o de layout público pasaba sin detección).
    # Corre contra el BUILD de producción (next start) + Postgres real, no `next dev`.
    #
    # Alcance del gate: smoke + a11y (invariantes) + axe (WCAG 2.1 A/AA) + compra (carrito→checkout).
    # FUERA del gate (follow-up, corren local/preview): estudio (afirma el canvas Konva → requiere
    # sembrar un producto de superficie foto, no el EVENT_FAVOR del seed base), regresión visual
    # (snapshots por-píxel → requieren baseline en imagen pinneada) y admin-login/admin-mfa
    # (requieren el stack Supabase real / GoTrue). Ver docs/TESTING.md.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lucams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lucams_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lucams_test
      # Los flujos ANÓNIMOS del E2E no contactan Supabase (getUser sin cookie → null), así que los
      # placeholders no-vacíos del env top-level bastan para que arranque next start (+ validación
      # de env). Wompi dummy: compra.spec se detiene antes de pagar; el provider solo se construye.
      WOMPI_ENV: sandbox
      WOMPI_PUBLIC_KEY: pub_test_ci
      WOMPI_PRIVATE_KEY: prv_test_ci
      WOMPI_INTEGRITY_SECRET: test_integrity_ci
      WOMPI_EVENTS_SECRET: test_events_ci
      PORT: "4000"
      # NO seteamos PLAYWRIGHT_BASE_URL → el webServer del config levanta `next start`
      # (build prod) en :4000, espera a que responda, corre los tests y lo tumba.
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lucams/db db:generate

      - name: Compat de Supabase (roles + extensiones + stubs auth/storage)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/supabase-compat.sql

      - name: Aplicar migraciones Prisma (schema desde cero)
        run: pnpm --filter @lucams/db exec prisma migrate deploy

      - name: Aplicar migraciones SQL de Supabase (RLS, funciones)
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed del catálogo (productos para PDP/carrito/estudio)
        run: pnpm --filter @lucams/db exec node scripts/seed-catalog-v2.mjs

      - name: Instalar navegador Playwright (chromium + deps)
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build de producción (necesario para el next start del webServer)
        run: pnpm --filter web build

      - name: Playwright (smoke + a11y + axe + compra)
        # El webServer del config levanta `next start` en :4000 y lo gestiona.
        run: pnpm --filter web exec playwright test smoke a11y axe compra --project=chromium

      - name: Subir reporte Playwright (si falla)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  secrets-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format-check:
    name: Prettier format check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

  dep-audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Falla el CI si hay vulnerabilidades high/critical en dependencias de PRODUCCIÓN
      # (Bloque C / S3). --prod excluye el toolchain de dev (vitest/jsdom/undici), cuyas
      # vulns no se despliegan. Si aparece una high en prod, hay que triarla antes de mergear.
      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --audit-level=high
