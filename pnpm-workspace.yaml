packages:
  - "apps/*"
  - "packages/*"

# Build scripts approved per pnpm 11+ security policy (write-protected since 2024).
# These packages require their install/postinstall scripts to function:
#   - sharp:         used by next/image for server-side image optimization (AVIF/WebP)
#   - unrs-resolver: required by tailwind v4 + eslint dependency resolution
#   - prisma / @prisma/client / @prisma/engines: download Prisma query engine binary
#   - msw: mock service worker — required for tests (postinstall sets up SW)
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  # postcss ≥8.5.23 + nanoid ≥3.3.18: GHSA-6g55-p6wh-862q (postcss) y
  # GHSA-2v37-7h3g-55p8 / CVE-2026-67213 (nanoid) — gate de audit 2026-08-07,
  # bump 3.3.17→3.3.18 por GHSA-2v37-7h3g-55p8 (loop infinito con size 0) 2026-08-28.
  postcss: 8.5.26
  nanoid: 3.3.18
  # deepmerge-ts ≥8: GHSA-ggr8-5vv4-36mx (stack exhaustion al mergear grafos recursivos),
  # cadena prisma→@prisma/config; solo usa deepmerge(), API estable en v8. Gate 2026-08-28.
  deepmerge-ts: 8.0.2
  "@babel/core": 7.29.6
  # sharp ≥0.35.5 (2026-10-06, gate CI audit high): GHSA-wq5f-xc86-pv6w /
  # CVE-2026-96889 — vulnerabilidad en la dependencia librsvg del binario
  # precompilado. PRODUCCIÓN (render de imprenta + optimizador de Next):
  # el override fuerza también la copia anidada next>sharp.
  sharp: 0.35.5
  # Cadena dev shadcn → @modelcontextprotocol/sdk arrastraba hono/@hono/node-server/qs
  # con CVEs moderados (hono <4.12.21: CVE-2026-47673..47676; @hono/node-server
  # <1.19.15: GHSA-frvp-7c67-39w9; qs ≤6.15.1: GHSA-q8mj-m7cp-5q26 / CVE-2026-8723).
  # Solo dev/CI (shadcn CLI), nada se despliega a Vercel. Gate 2026-08-29.
  # hono ^4.12.21 → ^4.13.7 (2026-10-03, Dependabot #19): GHSA XSS — hono/jsx
  # renderizaba strings planos sin escapar en boundary components (<4.13.7).
  hono: ^4.13.7
  "@hono/node-server": ^1.19.15
  # qs ≥6.16.0 (2026-09-30): GHSA-x5fp-wj9c-mxmx / CVE-2026-82562 (array-limit bypass
  # vía bracket-key comma) y GHSA-4mjr-xmp4-gh2g / CVE-2026-82417 (DoS isBuffer).
  # Consumidores: express 4/5 (body-parser) vía @lhci/cli y shadcn — solo dev/CI.
  qs: ^6.16.0
  # Gate dev-tooling 2026-08-29 — todas las cadenas siguientes son DEV-ONLY
  # (vitest/jsdom en tests, eslint en lint, shadcn y @lhci/cli en CI local); nada se
  # despliega a Vercel. Rangos verificados contra los package.json de los consumidores.
  # vite 8.0.12→8.2.2: GHSA-fx2h-pf6j-xcff y GHSA-v6wh-96g9-6wx3 (launch-editor: NTLMv2
  # hash disclosure vía UNC). vitest/@vitest/mocker 4.1.10 declaran peer ^6||^7||^8.
  vite: 8.2.2
  # undici 7.29.0→7.29.1 (2026-09-30): GHSA-3wwx-pv8p-q78v / CVE-2026-85024 (DoS en
  # WebSocket permessage-deflate). Sobre el pin anterior: 12 advisories resueltos en
  # 7.29.0 (ver gate 2026-08-29 abajo). jsdom ^7.25.0 y shadcn ^7.27.2 lo admiten.
  undici: 7.29.1
  # fast-uri 3.1.7→3.1.8 (2026-09-30): GHSA-hrr3-gc8f-f4qj (medium). Se queda en la
  # línea 3.x porque ajv declara ^3.0.1 (la 4.x es latest pero rompería el rango).
  # Pins previos: 3.1.7 (CVE-2026-84292, CVE-2026-84394), 3.1.6 (GHSA-4c8g-83qw-93j6
  # y 2 más). Cadena: ajv vía shadcn→@modelcontextprotocol/sdk — solo dev/CI.
  fast-uri: 3.1.8
  # ip-address 10.7.0→10.7.2 (2026-09-30): GHSA-j6r3-76f7-8jcv y GHSA-h3mg-xc3c-68pw
  # (medium; primera versión parchada 10.7.1, se pina el último 10.7.2). Pin previo:
  # GHSA-22jq-vg5j-6vgg / GHSA-4xrf-jv44-h6hh / GHSA-mwp4-54f8-5fhr
  # (socks ^10.1.1 vía @lhci/cli→puppeteer; express-rate-limit ^10.2.0).
  ip-address: 10.7.2
  # body-parser 2.2.2→2.3.0: GHSA-v422-hmwv-36x6. Selector acotado a la línea 2.x
  # (express@5 ^2.2.1 vía @modelcontextprotocol/sdk); express@4 (~1.20.5) no es vulnerable.
  "body-parser@^2.2.1": 2.3.0
  # brace-expansion (2026-09-30): 1.1.18→1.1.21 y 5.0.9→5.0.12 por las tandas nuevas
  # GHSA-6j4f-fj2g-mc7p (high), GHSA-qhr7-859c-m2p7 (high) y GHSA-q2hr-2g5m-vwhr
  # (medium) — la versión parchada más alta de cada línea (1.x: 1.1.21; 5.x: 5.0.12).
  # Pins previos: GHSA-3jxr-9vmj-r5cp / GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895
  # (minimatch@3 ^1.1.7 y minimatch@10 ^5.0.5).
  "brace-expansion@^1.1.7": 1.1.21
  "brace-expansion@^5.0.5": 5.0.12
  # js-yaml: GHSA-52cp-r559-cp3m / GHSA-5p4m-2wfm-xmqj / GHSA-h67p-54hq-rp68.
  # 3.15.0→3.15.2 (@lhci/utils ^3.13.1) y 4.1.1→4.3.2 (@eslint/eslintrc ^4.1.1,
  # cosmiconfig ^4.1.0).
  "js-yaml@^3.13.1": 3.15.2
  "js-yaml@^4.1.0": 4.3.2
  # tmp 0.0.33/0.1.0→0.2.7: GHSA-52f5-9888-hmc6 y GHSA-ph9p-34f9-6g65 (path traversal).
  # Fuera del rango declarado por external-editor (^0.0.33) y @lhci/cli (^0.1.0), pero la
  # API usada (tmpNameSync/fileSync) es idéntica en 0.2.x y tmp 0.2.0 elimina su dep rimraf
  # (que arrastraba otra cadena a brace-expansion). Verificado con probe de API 2026-08-29.
  tmp: 0.2.7
  # uuid 8.3.2→11.1.1: GHSA-w5hq-g745-h8pq. Fuera del rango de @lhci/cli (^8.3.1) pero
  # uuid@11 mantiene build CJS dual y el named export v4 que usa lhci (node-runner.js).
  uuid: 11.1.1
  # extract-zip (GHSA-jmr9-qjv8-65gv + GHSA symlink traversal, ambas high): sin patch
  # publicado (latest 2.0.1, paquete abandonado 2020). La cadena es
  # @lhci/cli→lighthouse→puppeteer-core@24→@puppeteer/browsers@2. Resuelto 2026-09-25
  # forzando @puppeteer/browsers@3.2.3 (reemplazó extract-zip por modern-tar). Fuera del
  # rango de puppeteer-core@24 (^2.x) — probe de API: Browser/launch/TimeoutError/
  # computeExecutablePath/computeSystemExecutablePath/createProfile/CDP_WEBSOCKET_ENDPOINT_REGEX/
  # WEBDRIVER_BIDI_WEBSOCKET_ENDPOINT_REGEX todos presentes en v3 (exports estables).
  "@puppeteer/browsers": 3.2.3
  # basic-ftp 5.3.1→^6.2.1 (2026-10-03, Dependabot #20, high): DoS de tiempo
  # cuadrático en el parser de `Client.list()` (RE_LINE backtracking, ≤6.2.0).
  # Cadena get-uri@6 → pac-proxy-agent → proxy-agent → @lhci/cli / puppeteer-core
  # (Lighthouse CI local) — DEV-ONLY, jamás se despliega. get-uri@6.0.5 declara la
  # línea 5.x, pero solo usa Client.connect/list/download (API estable en 6.x).
  "basic-ftp": ^6.2.1

# sharp queda clavado en 0.34.4 a propósito: la línea 0.35.x rompía las lambdas de Vercel
# (ERR_DLOPEN_FAILED libvips → 500 en todas las PDP — detectado en la certificación del
# 2026-07-28, auditoría histórica consolidada fuera del repo; la evidencia vive en git history).
# GHSA-f88m-g3jw-g9cj (libvips heredado, sharp <0.35.0) se excluye del gate de audit porque
# ya está mitigada en código por sharp-safe (bloquea los loaders alcanzables) y el riesgo
# residual quedó aceptado y documentado en la Fase A. NO quitar este ignore sin verificar
# antes que sharp 0.35.x carga en una lambda real de Vercel.
auditConfig:
  ignoreGhsas:
    - GHSA-f88m-g3jw-g9cj
    # GHSA-vfj7-8cjw-p6xm (braces ≤3.0.3, high, 2026-10-03): el advisory declara
    # patched >=3.0.4 pero esa versión NO existe en npm (latest = 3.0.3,
    # 2024-05-21) — advisory prematuro, no hay patch que aplicar. Cadena dev-only
    # (fast-glob vía eslint-config-next y ts-morph/shadcn): nada se despliega y
    # los consumidores no procesan globs de usuario. Revisar cuando exista 3.0.4.
    - GHSA-vfj7-8cjw-p6xm
