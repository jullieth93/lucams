<?xml version="1.0" encoding="UTF-8"?>
<!--
  Matrimonio Elegante — M.3.b.A2.
  Laurel wreath dorado + monograma + divider art deco.
  Stage 800×1000. Foto pareja en (80, 80) tamaño 640×560.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="gold-laurel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E6A8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A88829"/>
    </linearGradient>
  </defs>

  <!-- Background cream fullbleed -->
  <rect x="0" y="0" width="800" height="1000" fill="#FFF8F0"/>

  <!-- Borde dorado elegante (rectángulo decorativo) -->
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="url(#gold-laurel)" stroke-width="3"/>

  <!-- Laurel wreath dorado a la izquierda del divider -->
  <g transform="translate(280 720)" fill="url(#gold-laurel)" opacity="0.9">
    <!-- Hojas de laurel curvas -->
    <ellipse cx="-30" cy="0" rx="20" ry="8" transform="rotate(-15 -30 0)"/>
    <ellipse cx="-20" cy="-12" rx="18" ry="7" transform="rotate(0 -20 -12)"/>
    <ellipse cx="-5" cy="-20" rx="16" ry="6" transform="rotate(20 -5 -20)"/>
    <ellipse cx="-30" cy="14" rx="18" ry="7" transform="rotate(-30 -30 14)"/>
    <ellipse cx="-20" cy="24" rx="16" ry="6" transform="rotate(-45 -20 24)"/>
  </g>

  <!-- Laurel wreath dorado a la derecha del divider (espejo) -->
  <g transform="translate(520 720) scale(-1 1)" fill="url(#gold-laurel)" opacity="0.9">
    <ellipse cx="-30" cy="0" rx="20" ry="8" transform="rotate(-15 -30 0)"/>
    <ellipse cx="-20" cy="-12" rx="18" ry="7" transform="rotate(0 -20 -12)"/>
    <ellipse cx="-5" cy="-20" rx="16" ry="6" transform="rotate(20 -5 -20)"/>
    <ellipse cx="-30" cy="14" rx="18" ry="7" transform="rotate(-30 -30 14)"/>
    <ellipse cx="-20" cy="24" rx="16" ry="6" transform="rotate(-45 -20 24)"/>
  </g>

  <!-- Divider art deco horizontal (centro entre los laureles) -->
  <g transform="translate(400 720)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="url(#gold-laurel)" stroke-width="2"/>
    <!-- Diamante central -->
    <path d="M 0 -10 L 10 0 L 0 10 L -10 0 Z" fill="url(#gold-laurel)"/>
    <!-- Línea decorativa más fina arriba -->
    <line x1="-60" y1="-8" x2="60" y2="-8" stroke="url(#gold-laurel)" stroke-width="0.5"/>
    <!-- Línea decorativa más fina abajo -->
    <line x1="-60" y1="8" x2="60" y2="8" stroke="url(#gold-laurel)" stroke-width="0.5"/>
  </g>

  <!-- Ornamentos corner art deco en las 4 esquinas -->
  <g fill="url(#gold-laurel)" opacity="0.85">
    <!-- TL -->
    <path d="M 40 40 L 80 40 L 80 50 L 50 50 L 50 80 L 40 80 Z"/>
    <!-- TR -->
    <path d="M 760 40 L 720 40 L 720 50 L 750 50 L 750 80 L 760 80 Z"/>
    <!-- BL -->
    <path d="M 40 960 L 80 960 L 80 950 L 50 950 L 50 920 L 40 920 Z"/>
    <!-- BR -->
    <path d="M 760 960 L 720 960 L 720 950 L 750 950 L 750 920 L 760 920 Z"/>
  </g>

  <!-- "Save the Date" tipo monograma sutil en el footer -->
  <text x="400" y="990" font-family="Baloo 2, serif" font-size="14" letter-spacing="3" fill="#A88829" text-anchor="middle" opacity="0.7">
    · BODA ·
  </text>
</svg>
