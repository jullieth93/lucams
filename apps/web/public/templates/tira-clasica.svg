<svg width="390" height="1170" viewBox="0 0 390 1170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mockup "Tira Clásica" — tira photobooth 5×15 cm (owner 2026-11-03; antes
    6.5×20): 3 fotos apiladas casi a sangre sobre fondo de color (margen fino
    uniforme). El color real lo elige el cliente en el Estudio (frame-card +
    borderColor); acá se muestra lavanda de marca como ejemplo.
    390×1170 = aspect 1:3 exacto de la pieza; celdas 366×366 (foto 5×5 cm).
  -->
  <defs>
    <path id="heart" d="M0 18c-14-11-31-23-31-39 0-9 7-15 15-15 7 0 11 3 16 10 5-7 9-10 16-10 8 0 15 6 15 15 0 16-17 28-31 39z"/>
  </defs>
  <rect width="390" height="1170" fill="#7C6AAD"/>
  <!-- 3 celdas de foto (placeholder pastel) con margen fino de color -->
  <rect x="12" y="12" width="366" height="366" fill="#F4ECFF"/>
  <rect x="12" y="402" width="366" height="366" fill="#FFE5EC"/>
  <rect x="12" y="792" width="366" height="366" fill="#DDF5F3"/>
  <!-- Corazóncito de marca centrado en cada celda -->
  <g fill="#7C6AAD" opacity="0.35">
    <use href="#heart" x="195" y="177"/>
    <use href="#heart" x="195" y="567"/>
    <use href="#heart" x="195" y="957"/>
  </g>
</svg>
