<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cuadrado Minimal Art — M.3.b.A2.
  Marco minimal con cinta washi diagonal en esquina + sombra exterior.
  Stage 1080×1080. Área foto en (40,40) tamaño 1000×1000 cornerRadius 32.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Sombra exterior elegante -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <!-- Patrón washi tape (rayas diagonales pastel) -->
    <pattern id="washi-stripes" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(-45)">
      <rect width="20" height="20" fill="#FFB8D9"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#E85B9F" stroke-width="2" opacity="0.7"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Background blanco fullbleed con corner radius -->
  <rect x="20" y="20" width="1040" height="1040" rx="32" ry="32" fill="#FFFFFF" filter="url(#card-shadow)"/>

  <!-- Inner outline ultra-sutil -->
  <rect x="40" y="40" width="1000" height="1000" rx="32" ry="32" fill="none" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Cinta washi diagonal en esquina superior izquierda -->
  <g transform="rotate(-45 110 110)">
    <rect x="0" y="80" width="220" height="60" fill="url(#washi-stripes)" opacity="0.95"/>
    <!-- Sombra sutil del washi -->
    <rect x="0" y="138" width="220" height="3" fill="#000" opacity="0.1"/>
  </g>

  <!-- Cinta washi diagonal en esquina inferior derecha (espejo, color brand-yellow) -->
  <g transform="rotate(-45 970 970)">
    <rect x="860" y="940" width="220" height="60" fill="#FFD93D" opacity="0.95"/>
    <rect x="860" y="998" width="220" height="3" fill="#000" opacity="0.1"/>
  </g>
</svg>
