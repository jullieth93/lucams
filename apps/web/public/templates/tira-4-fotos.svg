<svg width="390" height="1288" viewBox="0 0 390 1288" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mockup "Tira 4 fotos" — tira photobooth 5×16.5 cm (owner 2026-11-03; antes
    6.5×26.5): 4 fotos apiladas casi a sangre sobre fondo de color (margen fino
    uniforme). El color real lo elige el cliente en el Estudio (frame-card +
    borderColor); acá se muestra lavanda de marca como ejemplo. Misma línea
    visual que tira-clasica.svg (la de 3 fotos), escalada a 4 celdas.
    390×1288 ≈ aspect 5:16.5 de la pieza; celdas 366×298 (foto 5×4.125 cm,
    APAISADA — la celda física ya no es cuadrada).
  -->
  <defs>
    <path id="heart" d="M0 18c-14-11-31-23-31-39 0-9 7-15 15-15 7 0 11 3 16 10 5-7 9-10 16-10 8 0 15 6 15 15 0 16-17 28-31 39z"/>
  </defs>
  <rect width="390" height="1288" fill="#7C6AAD"/>
  <!-- 4 celdas de foto (placeholder pastel) con margen fino de color -->
  <rect x="12" y="12" width="366" height="298" fill="#F4ECFF"/>
  <rect x="12" y="334" width="366" height="298" fill="#FFE5EC"/>
  <rect x="12" y="656" width="366" height="298" fill="#DDF5F3"/>
  <rect x="12" y="978" width="366" height="298" fill="#FFF3C9"/>
  <!-- Corazóncito de marca centrado en cada celda -->
  <g fill="#7C6AAD" opacity="0.35">
    <use href="#heart" x="195" y="143"/>
    <use href="#heart" x="195" y="465"/>
    <use href="#heart" x="195" y="787"/>
    <use href="#heart" x="195" y="1109"/>
  </g>
</svg>
