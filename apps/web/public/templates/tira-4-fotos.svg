<svg width="390" height="1590" viewBox="0 0 390 1590" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mockup "Tira 4 fotos" (2026-09-14) — tira photobooth 6.5×26.5 cm:
    4 fotos apiladas casi a sangre sobre fondo de color (margen fino uniforme).
    El color real lo elige el cliente en el Estudio (frame-card + borderColor);
    acá se muestra lavanda de marca como ejemplo. Misma línea visual que
    tira-clasica.svg (la de 3 fotos), escalada a 4 celdas.
  -->
  <rect width="390" height="1590" fill="#7C6AAD"/>
  <!-- 4 celdas de foto (placeholder pastel) con margen fino de color -->
  <rect x="12" y="12" width="366" height="382" fill="#F4ECFF"/>
  <rect x="12" y="406" width="366" height="382" fill="#FFE5EC"/>
  <rect x="12" y="800" width="366" height="382" fill="#DDF5F3"/>
  <rect x="12" y="1194" width="366" height="382" fill="#FFF3C9"/>
  <!-- Corazóncito de marca centrado en cada celda -->
  <g fill="#7C6AAD" opacity="0.35">
    <path d="M195 203c-14-11-31-23-31-39 0-9 7-15 15-15 7 0 11 3 16 10 5-7 9-10 16-10 8 0 15 6 15 15 0 16-17 28-31 39z"/>
    <path d="M195 597c-14-11-31-23-31-39 0-9 7-15 15-15 7 0 11 3 16 10 5-7 9-10 16-10 8 0 15 6 15 15 0 16-17 28-31 39z"/>
    <path d="M195 991c-14-11-31-23-31-39 0-9 7-15 15-15 7 0 11 3 16 10 5-7 9-10 16-10 8 0 15 6 15 15 0 16-17 28-31 39z"/>
    <path d="M195 1385c-14-11-31-23-31-39 0-9 7-15 15-15 7 0 11 3 16 10 5-7 9-10 16-10 8 0 15 6 15 15 0 16-17 28-31 39z"/>
  </g>
</svg>
