<?xml version="1.0" encoding="UTF-8"?>
<!--
  Calendario Floral 2026 — M.3.b.A2.
  Banner floral elaborado top + área foto + área mes editable.
  Stage 1080×1400. Foto en (60, 220) tamaño 960×720.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1400" width="1080" height="1400">
  <defs>
    <linearGradient id="cal-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background cream fullbleed -->
  <rect x="0" y="0" width="1080" height="1400" fill="#FFF8F0"/>

  <!-- Banner floral superior (área top con flores SVG paths) -->
  <rect x="0" y="0" width="1080" height="200" fill="#FFB8D9" opacity="0.85"/>

  <!-- Flores decorativas en el banner top -->
  <g transform="translate(540 100)">
    <!-- Flor central grande -->
    <g>
      <ellipse cx="0" cy="-32" rx="14" ry="28" fill="#E85B9F"/>
      <ellipse cx="22" cy="-22" rx="14" ry="28" fill="#E85B9F" transform="rotate(45)"/>
      <ellipse cx="32" cy="0" rx="14" ry="28" fill="#E85B9F" transform="rotate(90)"/>
      <ellipse cx="22" cy="22" rx="14" ry="28" fill="#E85B9F" transform="rotate(135)"/>
      <ellipse cx="0" cy="32" rx="14" ry="28" fill="#E85B9F" transform="rotate(180)"/>
      <ellipse cx="-22" cy="22" rx="14" ry="28" fill="#E85B9F" transform="rotate(225)"/>
      <ellipse cx="-32" cy="0" rx="14" ry="28" fill="#E85B9F" transform="rotate(270)"/>
      <ellipse cx="-22" cy="-22" rx="14" ry="28" fill="#E85B9F" transform="rotate(315)"/>
      <circle r="14" fill="#FFD93D"/>
    </g>
    <!-- 4 flores chicas alrededor -->
    <g transform="translate(-180 -10) scale(0.5)" fill="#7C6AAD">
      <circle r="20"/>
      <circle cx="0" cy="-24" r="14"/>
      <circle cx="22" cy="-12" r="14"/>
      <circle cx="22" cy="12" r="14"/>
      <circle cx="0" cy="24" r="14"/>
      <circle cx="-22" cy="12" r="14"/>
      <circle cx="-22" cy="-12" r="14"/>
      <circle r="10" fill="#FFD93D"/>
    </g>
    <g transform="translate(180 -10) scale(0.5)" fill="#5DD9D1">
      <circle r="20"/>
      <circle cx="0" cy="-24" r="14"/>
      <circle cx="22" cy="-12" r="14"/>
      <circle cx="22" cy="12" r="14"/>
      <circle cx="0" cy="24" r="14"/>
      <circle cx="-22" cy="12" r="14"/>
      <circle cx="-22" cy="-12" r="14"/>
      <circle r="10" fill="#FFD93D"/>
    </g>
    <g transform="translate(-110 50) scale(0.4)" fill="#F58A6F">
      <circle r="20"/>
      <circle cx="0" cy="-24" r="14"/>
      <circle cx="22" cy="-12" r="14"/>
      <circle cx="22" cy="12" r="14"/>
      <circle cx="0" cy="24" r="14"/>
      <circle cx="-22" cy="12" r="14"/>
      <circle cx="-22" cy="-12" r="14"/>
      <circle r="10" fill="#FFFFFF"/>
    </g>
    <g transform="translate(110 50) scale(0.4)" fill="#F58A6F">
      <circle r="20"/>
      <circle cx="0" cy="-24" r="14"/>
      <circle cx="22" cy="-12" r="14"/>
      <circle cx="22" cy="12" r="14"/>
      <circle cx="0" cy="24" r="14"/>
      <circle cx="-22" cy="12" r="14"/>
      <circle cx="-22" cy="-12" r="14"/>
      <circle r="10" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Border decorativo separando el banner del resto -->
  <rect x="0" y="200" width="1080" height="4" fill="#7C6AAD"/>

  <!-- Borde del área foto (visible alrededor de la foto que va debajo) -->
  <rect x="50" y="210" width="980" height="740" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.6" rx="16"/>

  <!-- Footer decorativo bajo el área del mes -->
  <rect x="0" y="1200" width="1080" height="200" fill="#FFFFFF"/>
  <rect x="0" y="1196" width="1080" height="4" fill="#7C6AAD" opacity="0.4"/>

  <!-- Hojas decorativas en el footer (acompañan al mes y año) -->
  <g transform="translate(280 1300)" fill="#7C6AAD" opacity="0.5">
    <path d="M 0 0 Q -20 -15 -40 0 Q -30 15 0 0 Z"/>
    <path d="M -50 5 Q -70 -10 -90 5 Q -80 20 -50 5 Z"/>
  </g>
  <g transform="translate(800 1300) scale(-1 1)" fill="#7C6AAD" opacity="0.5">
    <path d="M 0 0 Q -20 -15 -40 0 Q -30 15 0 0 Z"/>
    <path d="M -50 5 Q -70 -10 -90 5 Q -80 20 -50 5 Z"/>
  </g>
</svg>
