<?xml version="1.0" encoding="UTF-8"?>
<!--
  Business Corporativo Limpio — M.3.b.A2.
  Acento turquoise gradient + checkmark + líneas separadoras profesionales.
  Stage 700×500 (proporción tarjeta de presentación 7×5 cm).
  Logo en (80, 80) tamaño 280×140 + datos contacto a la derecha.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5DD9D1"/>
      <stop offset="100%" stop-color="#3DA8A1"/>
    </linearGradient>
  </defs>

  <!-- Background blanco fullbleed -->
  <rect x="0" y="0" width="700" height="500" fill="#FFFFFF"/>

  <!-- Accent line vertical izquierda (gradient turquoise) -->
  <rect x="0" y="0" width="12" height="500" fill="url(#accent-grad)"/>

  <!-- Separador horizontal sutil entre logo area y datos -->
  <line x1="80" y1="240" x2="640" y2="240" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Línea vertical entre logo (izquierda) y datos (derecha) - solo zona contacto -->
  <line x1="430" y1="120" x2="430" y2="370" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Checkmark decorativo sutil en esquina top-right (icono profesional) -->
  <g transform="translate(660 50)" fill="none" stroke="#5DD9D1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <circle cx="0" cy="0" r="14" stroke-width="2"/>
    <polyline points="-6,0 -2,4 6,-4"/>
  </g>

  <!-- Líneas finas decorativas en footer -->
  <line x1="80" y1="450" x2="200" y2="450" stroke="#5DD9D1" stroke-width="2"/>

  <!-- "PROFESIONAL" microcopy decorativo -->
  <text x="350" y="470" font-family="Inter, sans-serif" font-size="10" letter-spacing="4" fill="#999" text-anchor="middle">
    LUCAMS PRINT
  </text>

  <!-- Esquinas decorativas sutiles -->
  <g stroke="#5DD9D1" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 660 460 L 680 460 L 680 480"/>
    <path d="M 660 30 L 680 30 L 680 10" />
  </g>
</svg>
