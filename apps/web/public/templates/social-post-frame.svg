<?xml version="1.0" encoding="UTF-8"?>
<!--
  Social Post Frame — M.3.b.A3 v4 (2026-05-13).
  Marco limpio basado literal en `ig_post.svg` (subido por Lucy).
  Sin los <text> placeholders del original (los reemplazan los text layers Konva).
  Sin checkerboard en photo area (la foto del cliente va DEBAJO del asset).

  Stage 400×580. Photo area (20, 85) tamaño 360×360.

  4 zonas editables (text layers overlay encima del asset):
    - user_name        x=75,  y=42   bold 15 #262626
    - likes_count      x=43,  y=507  bold 14 #262626
    - title_caption    x=25,  y=534  regular 14 #262626
    - hashtags         x=130, y=534  regular 14 #00376B (inline con title)

  Photo placeholder (image-placeholder) en canvasData ocupa (20, 85, 360, 360).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="400" height="580" viewBox="0 0 400 580" fill="none">
  <defs>
    <!-- Sombra interior sutil del photo container -->
    <filter id="inner-shadow" x="0" y="0" width="100%" height="100%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.18" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Card blanca de fondo -->
  <rect width="400" height="580" fill="#FFFFFF"/>

  <!-- ══════════════ HEADER ══════════════ -->
  <g id="header">
    <!-- Avatar lineart (circle + face) -->
    <circle cx="45" cy="45" r="18" stroke="#262626" stroke-width="1.5" fill="none"/>
    <circle cx="45" cy="40.5" r="5" fill="#262626"/>
    <path d="M34 51.5C34 46.5 38.5 45.5 45 45.5C51.5 45.5 56 46.5 56 51.5"
          stroke="#262626" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- FOLLOW button (azul Instagram outline) -->
    <rect x="257" y="32" width="92" height="28" rx="4" stroke="#3897F0" stroke-width="1.2" fill="none"/>
    <text x="303" y="50" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12"
          fill="#3897F0" text-anchor="middle">FOLLOW</text>

    <!-- 3 dots opciones -->
    <circle cx="370" cy="46" r="1.5" fill="#262626"/>
    <circle cx="377" cy="46" r="1.5" fill="#262626"/>
    <circle cx="384" cy="46" r="1.5" fill="#262626"/>
  </g>

  <!-- ══════════════ PHOTO FRAME OUTLINE (20, 85, 360×360) ══════════════ -->
  <!-- Sin checkerboard ni <image> embebido: la foto del cliente va DEBAJO
       del asset (image-placeholder Konva). Acá solo el borde sutil. -->
  <rect x="20" y="85" width="360" height="360" fill="none" stroke="#EEEEEE" stroke-width="1" rx="2"/>

  <!-- ══════════════ ACTION ICONS (translate 25, 465) ══════════════ -->
  <g id="actions" transform="translate(25, 465)" fill="none" stroke="#262626" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Corazón outline -->
    <path d="M11 4.5C11 4.5 9.5 2 6.5 2C3 2 1 5 1 8.5C1 13 11 19 11 19C11 19 21 13 21 8.5C21 5 19 2 15.5 2C12.5 2 11 4.5 11 4.5Z"/>
    <!-- Comentario -->
    <path d="M53 2H73C75 2 76 3 76 5V17C76 19 75 20 73 20H60L53 25V2Z"/>
    <!-- Compartir (avión) -->
    <path d="M112 2L135 11L112 20L118 11L112 2Z"/>
    <!-- Bookmark (derecha) -->
    <path d="M335 2V22L345 16L355 22V2H335Z"/>
  </g>

  <!-- ══════════════ HEART FILL (likes row icon) ══════════════ -->
  <g transform="translate(25, 510)">
    <path d="M0 6C0 4 2 2 4 2C5 2 5 3 5 3C5 3 5 2 6 2C8 2 10 4 10 6L5 11L0 6Z" fill="#262626"/>
  </g>

  <!--
    Los 4 text overlays (user_name, likes_count, title_caption, hashtags)
    se renderean encima de este asset desde canvasData.
    Coords (Konva top-aligned, viewBox 400×580):
      - user_name      x=75,  y=42   Arial bold 15 #262626
      - likes_count    x=43,  y=507  Arial bold 14 #262626
      - title_caption  x=25,  y=534  Arial 14      #262626
      - hashtags       x=130, y=534  Arial 14      #00376B
  -->
</svg>
