<?xml version="1.0" encoding="UTF-8"?>
<!--
  Social Post Frame — M.3.b.A3 v5 (2026-05-13).
  Marco editable estilo social media, formato CUADRADO 590×590 px
  (= 5×5 cm a 300 DPI). Compatible con producto PHOTO_PACK cuadrado.

  Layout vertical compacto (header+foto+footer):
    - Header (y 0-58)    : avatar lineart + username + FOLLOW + 3 dots
    - Foto (y 65-445)    : 590×380 rectangular (crop cover de foto del cliente)
    - Action icons (y 470): heart/comment/share + bookmark
    - Likes row (y 500)  : heart fill + count
    - Caption + hashtags (y 528): title + hashtags inline

  4 zonas editables (text overlays Konva encima):
    - user_name      x=58,  y=22
    - likes_count    x=37,  y=495
    - title_caption  x=18,  y=525
    - hashtags       x=160, y=525   (inline con title)
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="590" height="590" viewBox="0 0 590 590" fill="none">
  <!-- Marco social post: header blanco (0-65) + footer blanco (445-590).
       Centro (y 65-445) queda TRANSPARENTE para que la foto del cliente
       se vea a través. Anti-patrón corregido 2026-05-14: antes había un
       <rect width="590" height="590" fill="white"/> fullbleed que tapaba
       la foto. -->
  <rect x="0" y="0" width="590" height="65" fill="#FFFFFF"/>
  <rect x="0" y="445" width="590" height="145" fill="#FFFFFF"/>

  <!-- ══════════════ HEADER (0-58) ══════════════ -->
  <g id="header">
    <!-- Avatar lineart -->
    <circle cx="32" cy="29" r="14" stroke="#262626" stroke-width="1.5" fill="none"/>
    <circle cx="32" cy="26" r="4" fill="#262626"/>
    <path d="M23 35C23 31 27 30 32 30C37 30 41 31 41 35"
          stroke="#262626" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- FOLLOW button (azul Instagram outline) -->
    <rect x="420" y="18" width="80" height="24" rx="4" stroke="#3897F0" stroke-width="1.2" fill="none"/>
    <text x="460" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11"
          fill="#3897F0" text-anchor="middle">FOLLOW</text>

    <!-- 3 dots opciones -->
    <circle cx="544" cy="30" r="1.5" fill="#262626"/>
    <circle cx="551" cy="30" r="1.5" fill="#262626"/>
    <circle cx="558" cy="30" r="1.5" fill="#262626"/>
  </g>

  <!-- Separador bajo header -->
  <line x1="0" y1="58" x2="590" y2="58" stroke="#EFEFEF" stroke-width="1"/>

  <!-- ══════════════ PHOTO FRAME (y 65-445) ══════════════ -->
  <!-- Sin checkerboard ni image embedded: la foto del cliente va DEBAJO
       (image-placeholder Konva). Acá solo borde sutil. -->
  <rect x="0" y="65" width="590" height="380" fill="none" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Separador bajo foto -->
  <line x1="0" y1="445" x2="590" y2="445" stroke="#EFEFEF" stroke-width="1"/>

  <!-- ══════════════ ACTION ICONS (y 470) ══════════════ -->
  <g id="actions" transform="translate(18, 470)" fill="none" stroke="#262626" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Corazón outline -->
    <path d="M11 4.5C11 4.5 9.5 2 6.5 2C3 2 1 5 1 8.5C1 13 11 19 11 19C11 19 21 13 21 8.5C21 5 19 2 15.5 2C12.5 2 11 4.5 11 4.5Z"/>
    <!-- Comentario -->
    <path d="M53 2H73C75 2 76 3 76 5V17C76 19 75 20 73 20H60L53 25V2Z"/>
    <!-- Compartir (avión) -->
    <path d="M112 2L135 11L112 20L118 11L112 2Z"/>
    <!-- Bookmark -->
    <path d="M525 2V22L535 16L545 22V2H525Z"/>
  </g>

  <!-- ══════════════ HEART FILL (likes row icon, y 500) ══════════════ -->
  <g transform="translate(18, 500)">
    <path d="M0 6C0 4 2 2 4 2C5 2 5 3 5 3C5 3 5 2 6 2C8 2 10 4 10 6L5 11L0 6Z" fill="#262626"/>
  </g>

  <!--
    Los 4 text overlays se renderean encima de este asset desde canvasData.
    Coords (Konva top-aligned, viewBox 590×590, 5×5 cm a 300 DPI):
      - user_name      x=58,  y=22   Arial bold 13 #262626
      - likes_count    x=37,  y=495  Arial bold 13 #262626
      - title_caption  x=18,  y=525  Arial 12      #262626
      - hashtags       x=160, y=525  Arial 12      #00376B
  -->
</svg>
