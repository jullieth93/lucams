<?xml version="1.0" encoding="UTF-8"?>
<!--
  Día de la Madre — Frase — M.3.b.A2.
  Flores grandes pink + verde sage + foto circular grande + área frase.
  Stage 1080×1080. Foto en (240, 100) tamaño 600×600 cornerRadius 300 (circular).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Background blushDeep pastel -->
  <rect x="0" y="0" width="1080" height="1080" fill="#FFE5EC"/>

  <!-- Flores grandes decorativas en las esquinas -->
  <!-- Esquina superior izquierda: flor pink grande -->
  <g transform="translate(110 110)" fill="#E85B9F">
    <ellipse cx="0" cy="-40" rx="22" ry="48"/>
    <ellipse cx="32" cy="-32" rx="22" ry="48" transform="rotate(45 32 -32)"/>
    <ellipse cx="48" cy="0" rx="22" ry="48" transform="rotate(90 48 0)"/>
    <ellipse cx="32" cy="32" rx="22" ry="48" transform="rotate(135 32 32)"/>
    <ellipse cx="0" cy="48" rx="22" ry="48"/>
    <ellipse cx="-32" cy="32" rx="22" ry="48" transform="rotate(45 -32 32)"/>
    <ellipse cx="-48" cy="0" rx="22" ry="48" transform="rotate(90 -48 0)"/>
    <ellipse cx="-32" cy="-32" rx="22" ry="48" transform="rotate(135 -32 -32)"/>
    <circle r="20" fill="#FFD93D"/>
    <!-- Hoja sage adjunta -->
    <ellipse cx="55" cy="55" rx="35" ry="14" fill="#B5C9A8" transform="rotate(45 55 55)"/>
  </g>

  <!-- Esquina superior derecha: flor sage con pink center -->
  <g transform="translate(970 110)" fill="#B5C9A8">
    <ellipse cx="0" cy="-32" rx="18" ry="36"/>
    <ellipse cx="22" cy="-22" rx="18" ry="36" transform="rotate(45 22 -22)"/>
    <ellipse cx="32" cy="0" rx="18" ry="36" transform="rotate(90 32 0)"/>
    <ellipse cx="22" cy="22" rx="18" ry="36" transform="rotate(135 22 22)"/>
    <ellipse cx="0" cy="32" rx="18" ry="36"/>
    <ellipse cx="-22" cy="22" rx="18" ry="36" transform="rotate(45 -22 22)"/>
    <ellipse cx="-32" cy="0" rx="18" ry="36" transform="rotate(90 -32 0)"/>
    <ellipse cx="-22" cy="-22" rx="18" ry="36" transform="rotate(135 -22 -22)"/>
    <circle r="15" fill="#E85B9F"/>
  </g>

  <!-- Esquina inferior izquierda: flor pink más chica -->
  <g transform="translate(130 950) scale(0.7)" fill="#E85B9F">
    <ellipse cx="0" cy="-40" rx="22" ry="48"/>
    <ellipse cx="32" cy="-32" rx="22" ry="48" transform="rotate(45 32 -32)"/>
    <ellipse cx="48" cy="0" rx="22" ry="48" transform="rotate(90 48 0)"/>
    <ellipse cx="32" cy="32" rx="22" ry="48" transform="rotate(135 32 32)"/>
    <ellipse cx="0" cy="48" rx="22" ry="48"/>
    <ellipse cx="-32" cy="32" rx="22" ry="48" transform="rotate(45 -32 32)"/>
    <ellipse cx="-48" cy="0" rx="22" ry="48" transform="rotate(90 -48 0)"/>
    <ellipse cx="-32" cy="-32" rx="22" ry="48" transform="rotate(135 -32 -32)"/>
    <circle r="20" fill="#FFD93D"/>
  </g>

  <!-- Esquina inferior derecha: flor sage + ornamento ribbon -->
  <g transform="translate(960 970) scale(0.6)" fill="#B5C9A8">
    <ellipse cx="0" cy="-32" rx="18" ry="36"/>
    <ellipse cx="22" cy="-22" rx="18" ry="36" transform="rotate(45 22 -22)"/>
    <ellipse cx="32" cy="0" rx="18" ry="36" transform="rotate(90 32 0)"/>
    <ellipse cx="22" cy="22" rx="18" ry="36" transform="rotate(135 22 22)"/>
    <ellipse cx="0" cy="32" rx="18" ry="36"/>
    <ellipse cx="-22" cy="22" rx="18" ry="36" transform="rotate(45 -22 22)"/>
    <ellipse cx="-32" cy="0" rx="18" ry="36" transform="rotate(90 -32 0)"/>
    <ellipse cx="-22" cy="-22" rx="18" ry="36" transform="rotate(135 -22 -22)"/>
    <circle r="15" fill="#E85B9F"/>
  </g>

  <!-- Anillo decorativo alrededor del área de foto circular -->
  <circle cx="540" cy="400" r="310" fill="none" stroke="#C97B89" stroke-width="6" opacity="0.7"/>
  <circle cx="540" cy="400" r="320" fill="none" stroke="#C97B89" stroke-width="1" opacity="0.4"/>

  <!-- Divider entre la foto y la frase -->
  <g transform="translate(540 770)">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#C97B89" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#E85B9F"/>
  </g>

  <!-- Pequeños corazones decorativos -->
  <g fill="#E85B9F" opacity="0.6">
    <g transform="translate(280 780) scale(0.4)">
      <path d="M 0 16 C -8 8 -20 0 -20 -10 C -20 -16 -16 -20 -10 -20 C -6 -20 -2 -18 0 -14 C 2 -18 6 -20 10 -20 C 16 -20 20 -16 20 -10 C 20 0 8 8 0 16 Z"/>
    </g>
    <g transform="translate(800 780) scale(0.4)">
      <path d="M 0 16 C -8 8 -20 0 -20 -10 C -20 -16 -16 -20 -10 -20 C -6 -20 -2 -18 0 -14 C 2 -18 6 -20 10 -20 C 16 -20 20 -16 20 -10 C 20 0 8 8 0 16 Z"/>
    </g>
  </g>
</svg>
