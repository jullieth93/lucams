<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cumpleaños Kawaii Pop — M.3.b.A2.
  Confetti shapes mixed (squiggles + stars + hearts + dots) + burst rays decorativos.
  Stage 800×800. Foto celebrante (130, 110) tamaño 540×380.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Background yellow brand fullbleed -->
  <rect x="0" y="0" width="800" height="800" fill="#FFD93D"/>

  <!-- Burst rays SVG desde el centro (decoración radial sutil) -->
  <g transform="translate(400 400)" opacity="0.08">
    <g fill="#7C6AAD">
      <polygon points="-3,-380 3,-380 0,-200"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(30)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(60)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(90)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(120)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(150)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(180)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(210)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(240)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(270)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(300)"/>
      <polygon points="-3,-380 3,-380 0,-200" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Card blanca interior (envoltorio del contenido) -->
  <rect x="70" y="70" width="660" height="660" rx="32" fill="#FFFFFF"/>

  <!-- CONFETTI shapes alrededor del card (en el yellow border) -->
  <g>
    <!-- Stars colorful en posiciones random -->
    <g transform="translate(50 80)">
      <path d="M 0 -12 L 3 -4 L 12 -4 L 5 2 L 8 11 L 0 5 L -8 11 L -5 2 L -12 -4 L -3 -4 Z" fill="#E85B9F"/>
    </g>
    <g transform="translate(740 60)">
      <path d="M 0 -10 L 3 -3 L 10 -3 L 4 2 L 6 9 L 0 5 L -6 9 L -4 2 L -10 -3 L -3 -3 Z" fill="#5DD9D1"/>
    </g>
    <g transform="translate(30 740)">
      <path d="M 0 -12 L 3 -4 L 12 -4 L 5 2 L 8 11 L 0 5 L -8 11 L -5 2 L -12 -4 L -3 -4 Z" fill="#7C6AAD"/>
    </g>
    <g transform="translate(750 720)">
      <path d="M 0 -10 L 3 -3 L 10 -3 L 4 2 L 6 9 L 0 5 L -6 9 L -4 2 L -10 -3 L -3 -3 Z" fill="#F58A6F"/>
    </g>

    <!-- Hearts -->
    <g transform="translate(770 380) scale(0.4)">
      <path d="M 0 16 C -8 8 -20 0 -20 -10 C -20 -16 -16 -20 -10 -20 C -6 -20 -2 -18 0 -14 C 2 -18 6 -20 10 -20 C 16 -20 20 -16 20 -10 C 20 0 8 8 0 16 Z" fill="#E85B9F"/>
    </g>
    <g transform="translate(35 380) scale(0.4)">
      <path d="M 0 16 C -8 8 -20 0 -20 -10 C -20 -16 -16 -20 -10 -20 C -6 -20 -2 -18 0 -14 C 2 -18 6 -20 10 -20 C 16 -20 20 -16 20 -10 C 20 0 8 8 0 16 Z" fill="#7C6AAD"/>
    </g>

    <!-- Dots / círculos colorful -->
    <circle cx="100" cy="40" r="6" fill="#5DD9D1"/>
    <circle cx="700" cy="35" r="6" fill="#E85B9F"/>
    <circle cx="55" cy="500" r="5" fill="#F58A6F"/>
    <circle cx="755" cy="500" r="5" fill="#7C6AAD"/>
    <circle cx="100" cy="770" r="6" fill="#5DD9D1"/>
    <circle cx="700" cy="775" r="6" fill="#FFD93D" stroke="#7C6AAD" stroke-width="2"/>

    <!-- Squiggles (rayitas diagonales) -->
    <g stroke="#7C6AAD" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M 250 35 q 8 -10 16 0 t 16 0"/>
      <path d="M 480 30 q 8 -10 16 0 t 16 0"/>
      <path d="M 250 770 q 8 -10 16 0 t 16 0"/>
      <path d="M 480 765 q 8 -10 16 0 t 16 0" stroke="#E85B9F"/>
    </g>
  </g>
</svg>
