<svg width="450" height="600" viewBox="0 0 450 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Marco "Polaroid Instagram" TRANSPARENTE — variante para FONDO NEGRO (Ola 4, Lucy 2026-07-23).
    Misma geometría que ig_post_3x4.svg pero con el chrome en BLANCO: la plantilla Instagram
    solo admite fondo blanco/negro y en fondo negro el chrome oscuro original no se leía.
    El botón "Seguir" conserva el azul de marca IG. Los textos editables (usuario, likes,
    caption, hashtags) son capas Konva y NO se hornean aquí; en fondo negro salen blancos
    por la regla de contraste automático de studio-slot.
  -->

  <!-- Definiciones -->
  <defs>
    <linearGradient id="avatarGradientDark" x1="42" y1="20" x2="42" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4ECFF"/>
      <stop offset="1" stop-color="#E85B9F"/>
    </linearGradient>
  </defs>

  <!-- CABECERA: avatar + ubicación + botón Seguir + opciones -->
  <g id="header">
    <!-- Avatar con borde blanco -->
    <circle cx="42" cy="42" r="22" fill="url(#avatarGradientDark)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="42" cy="37" r="7" fill="#BDBDBD"/>
    <path d="M30 54 C30 47 35 46 42 46 C49 46 54 47 54 54" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Ubicación (chrome estático, no editable) -->
    <text x="75" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF">Bogotá, Colombia</text>

    <!-- Botón Seguir (estático, no editable) -->
    <rect x="288" y="28" width="100" height="30" rx="4" stroke="#3897f0" stroke-width="1.2"/>
    <text x="338" y="48" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#3897f0" text-anchor="middle">Seguir</text>

    <!-- Opciones (tres puntos) -->
    <circle cx="412" cy="43" r="1.6" fill="#FFFFFF"/>
    <circle cx="420" cy="43" r="1.6" fill="#FFFFFF"/>
    <circle cx="428" cy="43" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- ÍCONOS DE INTERACCIÓN (justo debajo de la foto) -->
  <g id="actions" transform="translate(28, 500)">
    <!-- Corazón (like) -->
    <path d="M12 21.35l-1.45-1.32C5.4 14.36 2 11.28 2 7.5 2 4.42 4.42 2 7.5 2c1.74 0 3.41.81 4.5 2.09C13.09 2.81 14.76 2 16.5 2 19.58 2 22 4.42 22 7.5c0 3.78-3.4 6.86-8.55 12.54L12 21.35z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <!-- Comentario -->
    <path d="M45 25c0 1.1-.9 2-2 2H31l-8 6V5c0-1.1.9-2 2-2h18c1.1 0 2 .9 2 2v20z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none" transform="translate(28, -2)"/>
    <!-- Compartir (avión) -->
    <path d="M2 12l18-10-2 8h12v4H18l2 8L2 12z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none" transform="translate(70, 0)"/>
    <!-- Guardar (bookmark) -->
    <path d="M344 2v21l6-4 6 4V2h-12z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Ver comentarios (chrome estático) -->
  <text x="28" y="594" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">Ver los 12 comentarios</text>
</svg>
