<svg width="450" height="600" viewBox="0 0 450 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Marco "Polaroid Instagram" TRANSPARENTE — variante para FONDO NEGRO (Ola 9).
    Misma geometría que ig_post_3x4.svg (ver ese archivo para las zonas Konva) pero
    con el chrome en BLANCO para que se lea sobre el fondo oscuro. El corazón se
    mantiene rojo (#ED4956): es el sello visual del post y contrasta en ambos fondos.
    Los textos editables (usuario, ubicación, likes, caption, hashtags) son capas
    Konva; en fondo negro salen blancos por la regla de contraste automático.
  -->

  <defs>
    <linearGradient id="storyRingDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="50%" stop-color="#FF0069"/>
      <stop offset="100%" stop-color="#7638FA"/>
    </linearGradient>
  </defs>

  <!-- CABECERA -->
  <g id="header">
    <circle cx="38" cy="26" r="16.5" fill="none" stroke="url(#storyRingDark)" stroke-width="2.5"/>
    <circle cx="38" cy="26" r="13" fill="#3A3A3A"/>
    <circle cx="38" cy="22.5" r="4.5" fill="#6E6E6E"/>
    <path d="M29.5 33 C29.5 28.5 33 27.5 38 27.5 C43 27.5 46.5 28.5 46.5 33" fill="#6E6E6E"/>

    <!-- Menú de 3 puntos -->
    <circle cx="410" cy="26" r="1.8" fill="#FFFFFF"/>
    <circle cx="418" cy="26" r="1.8" fill="#FFFFFF"/>
    <circle cx="426" cy="26" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- ÍCONOS DE INTERACCIÓN -->
  <g id="actions" transform="translate(25, 461)">
    <path d="M18,35 C18,35 0,20 0,11 C0,5 4.5,0 10.5,0 C14,0 16.5,2 18,5 C19.5,2 22,0 25.5,0 C31.5,0 36,5 36,11 C36,20 18,35 18,35 Z"
          transform="scale(0.8)" fill="#ED4956"/>
    <path d="M20,0 C9,0 0,7 0,16 C0,21 3,26 7,29 L4,36 L12,32 C14.5,33 17,33.5 20,33.5 C31,33.5 40,26 40,16 C40,7 31,0 20,0 Z"
          transform="translate(52, 0.5) scale(0.72)" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round"/>
    <polygon points="1,7 23,1 17,23 12,12"
             transform="translate(97, 2)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="0,0 22,0 22,33 11,24 0,33"
             transform="translate(378, 0) scale(0.85)" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"/>
  </g>

  <!-- Pie horneado -->
  <text x="25" y="582" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.6">Ver los 12 comentarios</text>
</svg>
