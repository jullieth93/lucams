<svg width="450" height="600" viewBox="0 0 450 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Marco "Polaroid Instagram" TRANSPARENTE — variante para FONDO NEGRO (Ola 3c, Lucy 2026-07-23).
    Misma geometría que ig_post_3x4.svg pero con el chrome en BLANCO para que se lea sobre
    el fondo oscuro. El botón "Seguir" se retiró: un post publicado de Instagram muestra
    únicamente avatar, nombre de usuario y menú de opciones en la cabecera.
    Los textos editables (usuario, likes, caption, hashtags) son capas Konva y NO se hornean
    aquí; en fondo negro salen blancos por la regla de contraste automático de studio-slot.
  -->

  <!-- Definiciones -->
  <defs>
    <linearGradient id="avatarGradientDark" x1="28" y1="11" x2="28" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4ECFF"/>
      <stop offset="1" stop-color="#E85B9F"/>
    </linearGradient>
  </defs>

  <!-- CABECERA: avatar + menú de opciones -->
  <g id="header">
    <!-- Avatar con borde blanco -->
    <circle cx="28" cy="27" r="16" fill="url(#avatarGradientDark)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="28" cy="23.5" r="5" fill="#BDBDBD"/>
    <path d="M19 35 C19 30 23 29 28 29 C33 29 37 30 37 35" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Menú de 3 puntos (esquina derecha) -->
    <circle cx="418" cy="27" r="1.6" fill="#FFFFFF"/>
    <circle cx="426" cy="27" r="1.6" fill="#FFFFFF"/>
    <circle cx="434" cy="27" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- ÍCONOS DE INTERACCIÓN (pegados al borde inferior de la foto) -->
  <g id="actions" transform="translate(28, 462)">
    <!-- Corazón (me gusta) -->
    <path d="M12 21.35l-1.45-1.32C5.4 14.36 2 11.28 2 7.5 2 4.42 4.42 2 7.5 2c1.74 0 3.41.81 4.5 2.09C13.09 2.81 14.76 2 16.5 2 19.58 2 22 4.42 22 7.5c0 3.78-3.4 6.86-8.55 12.54L12 21.35z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <!-- Comentario -->
    <path d="M45 25c0 1.1-.9 2-2 2H31l-8 6V5c0-1.1.9-2 2-2h18c1.1 0 2 .9 2 2v20z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none" transform="translate(28, -2)"/>
    <!-- Compartir (avión de papel) -->
    <path d="M2 12l18-10-2 8h12v4H18l2 8L2 12z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none" transform="translate(70, 0)"/>
    <!-- Guardar (bookmark) -->
    <path d="M344 2v21l6-4 6 4V2h-12z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Pie de post realista -->
  <text x="28" y="548" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.6">Ver los 12 comentarios</text>
  <text x="28" y="565" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.5">Hace 2 días</text>
  <text x="28" y="582" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.6">Agrega un comentario...</text>
  <line x1="28" y1="598" x2="422" y2="598" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
</svg>
