<svg width="450" height="600" viewBox="0 0 450 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Marco "Polaroid Instagram" TRANSPARENTE — versión 450×600 (Ola 8).
    Formato físico 7.5×10 cm (3:4). El fondo blanco/negro lo aporta la capa `background`;
    la foto del cliente va en el image-placeholder `p1`. Los textos editables (usuario,
    likes, caption, hashtags) son capas Konva y NO se hornean aquí.
    Aireado realista: cabecera compacta, barra de acciones justo debajo de la foto,
    y pie con más respiro entre likes/caption/hashtags/comentarios — como un post real.
    Ventana de foto (transparente): x=25 y=54 → 400×400.
  -->

  <!-- Definiciones -->
  <defs>
    <linearGradient id="avatarGradient" x1="28" y1="11" x2="28" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4ECFF"/>
      <stop offset="1" stop-color="#E85B9F"/>
    </linearGradient>
  </defs>

  <!-- CABECERA: avatar + menú de opciones -->
  <!-- El nombre de usuario es una capa Konva editable; acá solo va el avatar y el menú. -->
  <g id="header">
    <!-- Avatar (32 px, alineado con un post real de Instagram) -->
    <circle cx="28" cy="27" r="16" fill="url(#avatarGradient)" stroke="#262626" stroke-width="1.5"/>
    <circle cx="28" cy="23.5" r="5" fill="#BDBDBD"/>
    <path d="M19 35 C19 30 23 29 28 29 C33 29 37 30 37 35" stroke="#262626" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Menú de 3 puntos (esquina derecha) -->
    <circle cx="418" cy="27" r="1.6" fill="#262626"/>
    <circle cx="426" cy="27" r="1.6" fill="#262626"/>
    <circle cx="434" cy="27" r="1.6" fill="#262626"/>
  </g>

  <!-- ÍCONOS DE INTERACCIÓN (justo debajo de la foto) -->
  <g id="actions" transform="translate(28, 458) scale(0.95)">
    <!-- Corazón (me gusta) -->
    <path d="M12 21.35l-1.45-1.32C5.4 14.36 2 11.28 2 7.5 2 4.42 4.42 2 7.5 2c1.74 0 3.41.81 4.5 2.09C13.09 2.81 14.76 2 16.5 2 19.58 2 22 4.42 22 7.5c0 3.78-3.4 6.86-8.55 12.54L12 21.35z" stroke="#262626" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <!-- Comentario -->
    <path d="M45 25c0 1.1-.9 2-2 2H31l-8 6V5c0-1.1.9-2 2-2h18c1.1 0 2 .9 2 2v20z" stroke="#262626" stroke-width="2" stroke-linejoin="round" fill="none" transform="translate(28, -2)"/>
    <!-- Compartir (avión de papel) -->
    <path d="M2 12l18-10-2 8h12v4H18l2 8L2 12z" stroke="#262626" stroke-width="2" stroke-linejoin="round" fill="none" transform="translate(70, 0)"/>
    <!-- Guardar (bookmark) -->
    <path d="M344 2v21l6-4 6 4V2h-12z" stroke="#262626" stroke-width="2" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Pie de post realista (chrome estático; los contadores/textos editables van por Konva) -->
  <text x="28" y="566" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8e8e8e">Ver los 12 comentarios</text>
  <text x="28" y="583" font-family="Inter, Arial, sans-serif" font-size="11" fill="#8e8e8e">Hace 2 días</text>
  <text x="28" y="600" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8e8e8e">Agrega un comentario...</text>
</svg>
