<?xml version="1.0" encoding="UTF-8"?>
<!--
  Corazón Vintage — M.3.b.A2.
  Heart shape REAL con Path bezier + borde dorado + 4 flores SVG en esquinas.
  Background blushDeep (#C97B89). Stage 1080×1080.
  Área foto en (180, 240) tamaño 720×600 cornerRadius 24 — DENTRO del heart.

  Fix del bug "Corazón Vintage se ve cuadrado": el heart real ahora se ve
  como heart real, con la foto del cliente DENTRO del heart como hueco.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6A8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A88829"/>
    </linearGradient>
  </defs>

  <!-- Heart shape grande de fondo (cream/light) que define el frame -->
  <!-- Path bezier escalado: heart de viewBox 100x100 → 960×900 centrado -->
  <g transform="translate(540 540) scale(9.6 9.0) translate(-50 -50)">
    <path d="M50,82 C28,68 6,52 6,32 C6,18 16,8 28,8 C38,8 44,12 50,22 C56,12 62,8 72,8 C84,8 94,18 94,32 C94,52 72,68 50,82 Z"
          fill="#FFF1F4"/>
  </g>

  <!-- Borde dorado del heart (mismo path, sin fill, con stroke) -->
  <g transform="translate(540 540) scale(9.6 9.0) translate(-50 -50)">
    <path d="M50,82 C28,68 6,52 6,32 C6,18 16,8 28,8 C38,8 44,12 50,22 C56,12 62,8 72,8 C84,8 94,18 94,32 C94,52 72,68 50,82 Z"
          fill="none"
          stroke="url(#gold-grad)"
          stroke-width="0.5"/>
  </g>

  <!-- 4 flores decorativas en las 4 esquinas (paths simplificados de margaritas) -->
  <g fill="#FFD93D" opacity="0.85">
    <!-- TL flor (cx=120, cy=130) -->
    <g transform="translate(120 130)">
      <ellipse cx="0" cy="-20" rx="10" ry="18" fill="#FFD93D"/>
      <ellipse cx="14" cy="-14" rx="10" ry="18" fill="#FFD93D" transform="rotate(45 14 -14)"/>
      <ellipse cx="20" cy="0" rx="10" ry="18" fill="#FFD93D" transform="rotate(90 20 0)"/>
      <ellipse cx="14" cy="14" rx="10" ry="18" fill="#FFD93D" transform="rotate(135 14 14)"/>
      <ellipse cx="0" cy="20" rx="10" ry="18" fill="#FFD93D"/>
      <ellipse cx="-14" cy="14" rx="10" ry="18" fill="#FFD93D" transform="rotate(45 -14 14)"/>
      <ellipse cx="-20" cy="0" rx="10" ry="18" fill="#FFD93D" transform="rotate(90 -20 0)"/>
      <ellipse cx="-14" cy="-14" rx="10" ry="18" fill="#FFD93D" transform="rotate(135 -14 -14)"/>
      <circle cx="0" cy="0" r="8" fill="#F58A6F"/>
    </g>
    <!-- TR flor -->
    <g transform="translate(960 130)">
      <ellipse cx="0" cy="-20" rx="10" ry="18"/>
      <ellipse cx="14" cy="-14" rx="10" ry="18" transform="rotate(45 14 -14)"/>
      <ellipse cx="20" cy="0" rx="10" ry="18" transform="rotate(90 20 0)"/>
      <ellipse cx="14" cy="14" rx="10" ry="18" transform="rotate(135 14 14)"/>
      <ellipse cx="0" cy="20" rx="10" ry="18"/>
      <ellipse cx="-14" cy="14" rx="10" ry="18" transform="rotate(45 -14 14)"/>
      <ellipse cx="-20" cy="0" rx="10" ry="18" transform="rotate(90 -20 0)"/>
      <ellipse cx="-14" cy="-14" rx="10" ry="18" transform="rotate(135 -14 -14)"/>
      <circle cx="0" cy="0" r="8" fill="#F58A6F"/>
    </g>
    <!-- BL flor (más chica) -->
    <g transform="translate(150 920) scale(0.7)">
      <ellipse cx="0" cy="-20" rx="10" ry="18"/>
      <ellipse cx="14" cy="-14" rx="10" ry="18" transform="rotate(45 14 -14)"/>
      <ellipse cx="20" cy="0" rx="10" ry="18" transform="rotate(90 20 0)"/>
      <ellipse cx="14" cy="14" rx="10" ry="18" transform="rotate(135 14 14)"/>
      <ellipse cx="0" cy="20" rx="10" ry="18"/>
      <ellipse cx="-14" cy="14" rx="10" ry="18" transform="rotate(45 -14 14)"/>
      <ellipse cx="-20" cy="0" rx="10" ry="18" transform="rotate(90 -20 0)"/>
      <ellipse cx="-14" cy="-14" rx="10" ry="18" transform="rotate(135 -14 -14)"/>
      <circle cx="0" cy="0" r="8" fill="#F58A6F"/>
    </g>
    <!-- BR flor (más chica) -->
    <g transform="translate(930 920) scale(0.7)">
      <ellipse cx="0" cy="-20" rx="10" ry="18"/>
      <ellipse cx="14" cy="-14" rx="10" ry="18" transform="rotate(45 14 -14)"/>
      <ellipse cx="20" cy="0" rx="10" ry="18" transform="rotate(90 20 0)"/>
      <ellipse cx="14" cy="14" rx="10" ry="18" transform="rotate(135 14 14)"/>
      <ellipse cx="0" cy="20" rx="10" ry="18"/>
      <ellipse cx="-14" cy="14" rx="10" ry="18" transform="rotate(45 -14 14)"/>
      <ellipse cx="-20" cy="0" rx="10" ry="18" transform="rotate(90 -20 0)"/>
      <ellipse cx="-14" cy="-14" rx="10" ry="18" transform="rotate(135 -14 -14)"/>
      <circle cx="0" cy="0" r="8" fill="#F58A6F"/>
    </g>
  </g>
</svg>
