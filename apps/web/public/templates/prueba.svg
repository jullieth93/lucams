<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 1080 1500">

  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C765"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8941F"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8A48C"/>
      <stop offset="100%" stop-color="#F58A6F"/>
    </linearGradient>
    <filter id="polaroidShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============ FONDO CREAM ============ -->
  <rect x="0" y="0" width="1080" height="1500" fill="#FFF8F0"/>

  <!-- ============ POLAROID BLANCO FULLBLEED CON SOMBRA ============ -->
  <g id="polaroid-frame" filter="url(#polaroidShadow)">
    <rect x="40" y="40" width="1000" height="1420" rx="6" fill="#FFFFFF"/>
  </g>

  <!-- borde interior fino sage para textura -->
  <rect x="55" y="55" width="970" height="1390" rx="4"
        fill="none" stroke="#B5C9A8" stroke-width="0.6" opacity="0.35"/>

  <!-- ============ ÁREA FOTO — DASHED VISIBLE ============ -->
  <!-- (130, 130, 820, 820) -->
  <rect x="130" y="130" width="820" height="820" rx="4"
        fill="none" stroke="#9DAF8E" stroke-width="1.2"
        stroke-dasharray="8 6" opacity="0.25"/>

  <!-- ============ ORNAMENTO GOLD ESQUINA SUPERIOR IZQUIERDA (anchor visual) ============ -->
  <g id="corner-ornament-tl" stroke-linecap="round" stroke-linejoin="round">
    <!-- arcos dorados angulares -->
    <path d="M 130 175 Q 130 130 175 130"
          fill="none" stroke="url(#goldGrad)" stroke-width="2.2" opacity="0.9"/>
    <path d="M 130 195 Q 130 145 180 145 L 185 145"
          fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
    <!-- diamante gold en el vértice -->
    <g transform="translate(130 130)">
      <path d="M 0 -6 L 6 0 L 0 6 L -6 0 Z" fill="url(#goldGrad)"/>
    </g>
    <!-- pequeño asterisco interior -->
    <g transform="translate(160 160)" fill="url(#goldGrad)" opacity="0.85">
      <path d="M 0 -6 L 1.2 -1.2 L 6 0 L 1.2 1.2 L 0 6 L -1.2 1.2 L -6 0 L -1.2 -1.2 Z"/>
    </g>
  </g>

  <!-- ============ ORNAMENTO GOLD ESQUINA SUPERIOR DERECHA (asimétrico, más pequeño) ============ -->
  <g id="corner-ornament-tr" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 905 130 Q 950 130 950 175"
          fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
    <g transform="translate(950 130)">
      <circle r="4" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- ============ FLORES SCRAPBOOK ESQUINA SUPERIOR DERECHA ============ -->
  <g id="flowers-tr" stroke-linecap="round" stroke-linejoin="round">
    <!-- flor grande pink -->
    <g transform="translate(890, 95)">
      <circle cx="0" cy="0" r="11" fill="#FFE5EC" stroke="#E85B9F" stroke-width="1.2"/>
      <circle cx="-10" cy="-6" r="8.5" fill="#FFE5EC" stroke="#E85B9F" stroke-width="1"/>
      <circle cx="10" cy="-6" r="8.5" fill="#FFE5EC" stroke="#E85B9F" stroke-width="1"/>
      <circle cx="-8" cy="9" r="8.5" fill="#FFE5EC" stroke="#E85B9F" stroke-width="1"/>
      <circle cx="8" cy="9" r="8.5" fill="#FFE5EC" stroke="#E85B9F" stroke-width="1"/>
      <circle cx="0" cy="0" r="4.5" fill="#D4AF37"/>
    </g>
    <!-- flor mediana coral al lado -->
    <g transform="translate(960, 75)">
      <circle cx="0" cy="0" r="7" fill="#F8A48C" stroke="#F58A6F" stroke-width="1"/>
      <circle cx="-6" cy="-4" r="5.5" fill="#F8A48C" stroke="#F58A6F" stroke-width="0.9"/>
      <circle cx="6" cy="-4" r="5.5" fill="#F8A48C" stroke="#F58A6F" stroke-width="0.9"/>
      <circle cx="-5" cy="6" r="5.5" fill="#F8A48C" stroke="#F58A6F" stroke-width="0.9"/>
      <circle cx="5" cy="6" r="5.5" fill="#F8A48C" stroke="#F58A6F" stroke-width="0.9"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFF8F0"/>
    </g>
    <!-- hojas decorativas al lado de las flores -->
    <ellipse cx="845" cy="105" rx="14" ry="5" transform="rotate(-35 845 105)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.9"/>
    <ellipse cx="930" cy="115" rx="11" ry="4" transform="rotate(45 930 115)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
  </g>

  <!-- ============ HOJAS LATERAL IZQUIERDO (marco lateral, distintos tamaños/rotaciones) ============ -->
  <g id="leaves-left" stroke-linecap="round" stroke-linejoin="round">
    <!-- rama vertical sutil -->
    <path d="M 80 280 Q 95 380 85 480 Q 75 580 90 680"
          fill="none" stroke="#9DAF8E" stroke-width="1.4" opacity="0.7"/>
    <!-- hojas variadas a lo largo -->
    <ellipse cx="78" cy="295" rx="13" ry="4.5" transform="rotate(-60 78 295)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
    <ellipse cx="92" cy="340" rx="11" ry="4" transform="rotate(50 92 340)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
    <ellipse cx="75" cy="395" rx="15" ry="5" transform="rotate(-70 75 395)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.9"/>
    <ellipse cx="95" cy="445" rx="10" ry="3.5" transform="rotate(45 95 445)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.7"/>
    <ellipse cx="80" cy="500" rx="12" ry="4.2" transform="rotate(-55 80 500)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
    <ellipse cx="90" cy="555" rx="14" ry="4.8" transform="rotate(60 90 555)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.9"/>
    <ellipse cx="75" cy="610" rx="11" ry="4" transform="rotate(-50 75 610)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
    <ellipse cx="88" cy="665" rx="13" ry="4.5" transform="rotate(55 88 665)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
  </g>

  <!-- ============ HOJAS LATERAL DERECHO (más espaciadas, asimétrico vs izquierdo) ============ -->
  <g id="leaves-right" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="998" cy="320" rx="12" ry="4" transform="rotate(70 998 320)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
    <ellipse cx="1005" cy="380" rx="10" ry="3.5" transform="rotate(85 1005 380)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.7"/>
    <ellipse cx="995" cy="450" rx="14" ry="4.8" transform="rotate(75 995 450)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.9"/>
    <ellipse cx="1000" cy="520" rx="11" ry="4" transform="rotate(80 1000 520)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
    <ellipse cx="990" cy="600" rx="13" ry="4.5" transform="rotate(72 990 600)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
    <ellipse cx="1003" cy="685" rx="10" ry="3.5" transform="rotate(88 1003 685)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.7"/>
  </g>

  <!-- ============ FLOR PEQUEÑA ESQUINA INFERIOR IZQUIERDA DE FOTO ============ -->
  <g id="flower-bl" transform="translate(155, 920)">
    <circle cx="0" cy="0" r="8" fill="#FFE5EC" stroke="#E85B9F" stroke-width="1"/>
    <circle cx="-7" cy="-4" r="6" fill="#FFE5EC" stroke="#E85B9F" stroke-width="0.9"/>
    <circle cx="7" cy="-4" r="6" fill="#FFE5EC" stroke="#E85B9F" stroke-width="0.9"/>
    <circle cx="-5" cy="7" r="6" fill="#FFE5EC" stroke="#E85B9F" stroke-width="0.9"/>
    <circle cx="5" cy="7" r="6" fill="#FFE5EC" stroke="#E85B9F" stroke-width="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#D4AF37"/>
  </g>

  <!-- ============ SPARKLES + DOTS DISPERSOS POR MARCOS LATERALES ============ -->
  <g id="sparkles-and-dots">
    <!-- Sparkles gold (tamaños variados) -->
    <g fill="url(#goldGrad)">
      <g transform="translate(720, 80)" opacity="0.9">
        <path d="M 0 -9 L 1.8 -1.8 L 9 0 L 1.8 1.8 L 0 9 L -1.8 1.8 L -9 0 L -1.8 -1.8 Z"/>
      </g>
      <g transform="translate(805, 65)" opacity="0.7">
        <path d="M 0 -5 L 1 -1 L 5 0 L 1 1 L 0 5 L -1 1 L -5 0 L -1 -1 Z"/>
      </g>
      <g transform="translate(220, 75)" opacity="0.8">
        <path d="M 0 -6 L 1.2 -1.2 L 6 0 L 1.2 1.2 L 0 6 L -1.2 1.2 L -6 0 L -1.2 -1.2 Z"/>
      </g>
      <g transform="translate(305, 105)" opacity="0.6">
        <path d="M 0 -4 L 0.8 -0.8 L 4 0 L 0.8 0.8 L 0 4 L -0.8 0.8 L -4 0 L -0.8 -0.8 Z"/>
      </g>
      <g transform="translate(65, 750)" opacity="0.75">
        <path d="M 0 -7 L 1.4 -1.4 L 7 0 L 1.4 1.4 L 0 7 L -1.4 1.4 L -7 0 L -1.4 -1.4 Z"/>
      </g>
      <g transform="translate(1015, 770)" opacity="0.7">
        <path d="M 0 -6 L 1.2 -1.2 L 6 0 L 1.2 1.2 L 0 6 L -1.2 1.2 L -6 0 L -1.2 -1.2 Z"/>
      </g>
      <g transform="translate(1010, 230)" opacity="0.65">
        <path d="M 0 -5 L 1 -1 L 5 0 L 1 1 L 0 5 L -1 1 L -5 0 L -1 -1 Z"/>
      </g>
      <g transform="translate(950, 985)" opacity="0.75">
        <path d="M 0 -6 L 1.2 -1.2 L 6 0 L 1.2 1.2 L 0 6 L -1.2 1.2 L -6 0 L -1.2 -1.2 Z"/>
      </g>
    </g>

    <!-- Dots sage dispersos -->
    <g fill="#B5C9A8">
      <circle cx="290" cy="90" r="3" opacity="0.7"/>
      <circle cx="385" cy="80" r="2" opacity="0.6"/>
      <circle cx="660" cy="105" r="2.5" opacity="0.65"/>
      <circle cx="760" cy="115" r="2" opacity="0.55"/>
      <circle cx="100" cy="730" r="2.5" opacity="0.65"/>
      <circle cx="1020" cy="290" r="3" opacity="0.7"/>
      <circle cx="990" cy="745" r="2.2" opacity="0.6"/>
      <circle cx="110" cy="200" r="2" opacity="0.55"/>
    </g>

    <!-- Dots blush dispersos (toque cálido) -->
    <g fill="#E85B9F">
      <circle cx="450" cy="95" r="2.5" opacity="0.6"/>
      <circle cx="580" cy="80" r="2" opacity="0.55"/>
      <circle cx="200" cy="920" r="2.5" opacity="0.6"/>
      <circle cx="985" cy="900" r="2" opacity="0.55"/>
    </g>
  </g>

  <!-- ============ LÍNEA SEPARADORA CORAL (con detalle central) ============ -->
  <g id="divider">
    <line x1="100" y1="1015" x2="465" y2="1015"
          stroke="url(#coralGrad)" stroke-width="1.5" opacity="0.85" stroke-linecap="round"/>
    <line x1="615" y1="1015" x2="980" y2="1015"
          stroke="url(#coralGrad)" stroke-width="1.5" opacity="0.85" stroke-linecap="round"/>
    <!-- ornamento central: diamante + 2 puntos -->
    <circle cx="490" cy="1015" r="2.5" fill="#F58A6F"/>
    <g transform="translate(540 1015)">
      <path d="M 0 -7 L 7 0 L 0 7 L -7 0 Z" fill="url(#coralGrad)"/>
      <path d="M 0 -3.5 L 3.5 0 L 0 3.5 L -3.5 0 Z" fill="#FFFFFF"/>
    </g>
    <circle cx="590" cy="1015" r="2.5" fill="#F58A6F"/>
  </g>

  <!-- ============ "MAYO" (REDUCIDO: 110px, no toca grilla) ============ -->
  <g id="month-name">
    <text x="100" y="1180"
          font-family="Helvetica, Arial, sans-serif"
          font-size="110" font-weight="900"
          fill="#262626"
          letter-spacing="-2">MAYO</text>
  </g>

  <!-- ============ "2026" SERIF DEBAJO ============ -->
  <g id="year">
    <text x="105" y="1240"
          font-family="Georgia, serif"
          font-size="38" font-weight="400"
          fill="#666666"
          letter-spacing="10">2026</text>
  </g>

  <!-- ============ DECORACIÓN BAJO EL AÑO (sage + coral toque) ============ -->
  <g id="under-year-decor">
    <line x1="105" y1="1270" x2="280" y2="1270"
          stroke="#B5C9A8" stroke-width="1" opacity="0.65" stroke-linecap="round"/>
    <circle cx="295" cy="1270" r="3" fill="#F58A6F" opacity="0.85"/>
    <!-- pequeña hoja al final de la línea -->
    <ellipse cx="320" cy="1270" rx="9" ry="3" transform="rotate(-15 320 1270)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.7" opacity="0.85"/>
  </g>

  <!-- ============ GRILLA CALENDARIO (movida a la derecha, no toca MAYO) ============ -->
  <!--
    Posición: x desde 470 a 990 (cols centradas: 510, 580, 650, 720, 790, 860, 930)
    Y headers en 1090, días empiezan 1140
    MAYO 2026: viernes 1, sábado 2, ..., domingo 31
    Domingos coral: 3, 10, 17, 24, 31
  -->
  <g id="calendar-grid" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- HEADER D L M M J V S -->
    <g font-size="20" font-weight="700" letter-spacing="1" fill="#9DAF8E">
      <text x="510" y="1100">D</text>
      <text x="580" y="1100">L</text>
      <text x="650" y="1100">M</text>
      <text x="720" y="1100">M</text>
      <text x="790" y="1100">J</text>
      <text x="860" y="1100">V</text>
      <text x="930" y="1100">S</text>
    </g>
    <line x1="485" y1="1115" x2="955" y2="1115"
          stroke="#B5C9A8" stroke-width="0.8" opacity="0.65"/>

    <!-- Row 1 — viernes 1, sábado 2 -->
    <g font-size="26" font-weight="600" fill="#262626">
      <text x="860" y="1155">1</text>
      <text x="930" y="1155">2</text>
    </g>

    <!-- Row 2 — 3 al 9 -->
    <g font-size="26" font-weight="600">
      <text x="510" y="1200" fill="#F58A6F" font-weight="700">3</text>
      <text x="580" y="1200" fill="#262626">4</text>
      <text x="650" y="1200" fill="#262626">5</text>
      <text x="720" y="1200" fill="#262626">6</text>
      <text x="790" y="1200" fill="#262626">7</text>
      <text x="860" y="1200" fill="#262626">8</text>
      <text x="930" y="1200" fill="#262626">9</text>
    </g>

    <!-- Row 3 — 10 al 16 -->
    <g font-size="26" font-weight="600">
      <text x="510" y="1245" fill="#F58A6F" font-weight="700">10</text>
      <text x="580" y="1245" fill="#262626">11</text>
      <text x="650" y="1245" fill="#262626">12</text>
      <text x="720" y="1245" fill="#262626">13</text>
      <text x="790" y="1245" fill="#262626">14</text>
      <text x="860" y="1245" fill="#262626">15</text>
      <text x="930" y="1245" fill="#262626">16</text>
    </g>

    <!-- Row 4 — 17 al 23 -->
    <g font-size="26" font-weight="600">
      <text x="510" y="1290" fill="#F58A6F" font-weight="700">17</text>
      <text x="580" y="1290" fill="#262626">18</text>
      <text x="650" y="1290" fill="#262626">19</text>
      <text x="720" y="1290" fill="#262626">20</text>
      <text x="790" y="1290" fill="#262626">21</text>
      <text x="860" y="1290" fill="#262626">22</text>
      <text x="930" y="1290" fill="#262626">23</text>
    </g>

    <!-- Row 5 — 24 al 30 -->
    <g font-size="26" font-weight="600">
      <text x="510" y="1335" fill="#F58A6F" font-weight="700">24</text>
      <text x="580" y="1335" fill="#262626">25</text>
      <text x="650" y="1335" fill="#262626">26</text>
      <text x="720" y="1335" fill="#262626">27</text>
      <text x="790" y="1335" fill="#262626">28</text>
      <text x="860" y="1335" fill="#262626">29</text>
      <text x="930" y="1335" fill="#262626">30</text>
    </g>

    <!-- Row 6 — domingo 31 -->
    <g font-size="26" font-weight="600">
      <text x="510" y="1380" fill="#F58A6F" font-weight="700">31</text>
    </g>
  </g>

  <!-- ============ HOJITAS Y FLOR DECORATIVA BAJO EL CALENDARIO (derecha inferior) ============ -->
  <g id="bottom-right-cluster" stroke-linecap="round" stroke-linejoin="round">
    <!-- mini ramita -->
    <path d="M 780 1415 Q 830 1405 880 1420 Q 920 1430 960 1418"
          fill="none" stroke="#9DAF8E" stroke-width="1.3" opacity="0.75"/>
    <ellipse cx="800" cy="1412" rx="10" ry="3.5" transform="rotate(-15 800 1412)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.7"/>
    <ellipse cx="850" cy="1407" rx="12" ry="4" transform="rotate(-8 850 1407)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
    <ellipse cx="910" cy="1422" rx="9" ry="3" transform="rotate(8 910 1422)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.7"/>
    <ellipse cx="945" cy="1415" rx="11" ry="3.8" transform="rotate(-5 945 1415)"
             fill="#B5C9A8" stroke="#9DAF8E" stroke-width="0.8"/>
    <!-- pequeña flor coral en la rama -->
    <g transform="translate(875, 1418)">
      <circle cx="0" cy="0" r="5" fill="#F8A48C" stroke="#F58A6F" stroke-width="0.9"/>
      <circle cx="-4" cy="-3" r="4" fill="#F8A48C" stroke="#F58A6F" stroke-width="0.7"/>
      <circle cx="4" cy="-3" r="4" fill="#F8A48C" stroke="#F58A6F" stroke-width="0.7"/>
      <circle cx="-3" cy="4" r="4" fill="#F8A48C" stroke="#F58A6F" stroke-width="0.7"/>
      <circle cx="3" cy="4" r="4" fill="#F8A48C" stroke="#F58A6F" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="2" fill="#D4AF37"/>
    </g>
    <!-- sparkle gold final -->
    <g transform="translate(975, 1408)" fill="url(#goldGrad)" opacity="0.85">
      <path d="M 0 -5 L 1 -1 L 5 0 L 1 1 L 0 5 L -1 1 L -5 0 L -1 -1 Z"/>
    </g>
  </g>

</svg>