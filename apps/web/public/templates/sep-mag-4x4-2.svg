<svg width="420" height="240" viewBox="0 0 420 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mockup "Magnéticos — 4×4.2 cm" (2026-09-14) — separador de libros magnético:
    UNA tira 8×4.2 cm que se DOBLA sobre la página. Desplegada: cara A | cara B,
    línea de doblez al centro. El diseño del cliente va a sangre en cada cara.
  -->
  <rect x="10" y="45" width="400" height="105" rx="20" fill="#7C6AAD"/>
  <rect x="17" y="53" width="188" height="89" rx="14" fill="#F4ECFF"/>
  <rect x="215" y="53" width="188" height="89" rx="14" fill="#DDF5F3"/>
  <!-- línea de doblez -->
  <line x1="210" y1="51" x2="210" y2="144" stroke="#3D2E5C" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <g fill="#7C6AAD" opacity="0.35">
    <path d="M111 106c-11-9-24-18-24-30 0-7 5-12 12-12 5 0 9 3 12 8 4-5 7-8 12-8 7 0 12 5 12 12 0 12-13 21-24 30z"/>
    <path d="M309 106c-11-9-24-18-24-30 0-7 5-12 12-12 5 0 9 3 12 8 4-5 7-8 12-8 7 0 12 5 12 12 0 12-13 21-24 30z"/>
  </g>
  <text x="111" y="180" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="16" fill="#3D2E5C">Cara A</text>
  <text x="309" y="180" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="16" fill="#3D2E5C">Cara B</text>
  <text x="210" y="216" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" fill="#7C6AAD">Separador magnético 4×4.2 cm · se dobla sobre la página</text>
</svg>
