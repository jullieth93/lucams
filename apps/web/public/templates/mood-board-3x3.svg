<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mood Board 3×3 — M.3.b.A2.
  Grid 3×3 con washi tape strips en 3 esquinas + sombra suave general.
  Stage 1080×1080. Las fotos del cliente van en los 9 slots del grid.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <filter id="board-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background cream con sombra exterior -->
  <rect x="20" y="20" width="1040" height="1040" rx="16" fill="#FFF8F0" filter="url(#board-shadow)"/>

  <!-- Washi tape strip horizontal en la esquina top-left (sobresale del board) -->
  <g transform="translate(60 30) rotate(-8 50 30)">
    <rect x="0" y="0" width="160" height="40" fill="#5DD9D1" opacity="0.85"/>
    <line x1="0" y1="10" x2="160" y2="10" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="25" x2="160" y2="25" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Washi tape strip top-right -->
  <g transform="translate(860 35) rotate(6 80 25)">
    <rect x="0" y="0" width="170" height="40" fill="#FFD93D" opacity="0.9"/>
    <circle cx="20" cy="20" r="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="50" cy="20" r="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="80" cy="20" r="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="110" cy="20" r="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="140" cy="20" r="2" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Washi tape strip bottom-right -->
  <g transform="translate(870 1010) rotate(-5 75 25)">
    <rect x="0" y="0" width="160" height="38" fill="#F58A6F" opacity="0.9"/>
    <line x1="0" y1="0" x2="160" y2="38" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="38" x2="160" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Texto decorativo "MOOD" stylized en esquina inferior izquierda -->
  <text x="60" y="1030" font-family="Fredoka, sans-serif" font-size="32" font-weight="bold" fill="#7C6AAD" opacity="0.6">
    ✨ MIS RECUERDOS
  </text>
</svg>
