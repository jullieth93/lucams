<svg width="400" height="580" viewBox="0 0 400 580" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Marco "Polaroid Instagram" TRANSPARENTE (auditoría v3 · B4). Antes tenía un rect blanco de card
    completo + un checkerboard en la ventana de foto → TAPABAN la foto del cliente en el editor, el
    preview y el PNG de imprenta. Ahora el marco es SOLO el chrome (avatar, botón, íconos): el fondo
    blanco lo aporta la capa `background` del canvas y la foto la capa `p1`, así la ventana queda
    transparente y la foto se ve. Los textos (usuario, likes, título, hashtags) son capas EDITABLES
    de Konva y NO se hornean aquí (evita el doble-texto que había antes).
    Ventana de foto (transparente): x20 y80 → 360×360, alineada con el photoSlot p1 del seed.
  -->

  <!-- CABECERA: avatar + botón Seguir + opciones -->
  <g id="header">
    <circle cx="45" cy="45" r="18" stroke="#262626" stroke-width="1.5"/>
    <circle cx="45" cy="40.5" r="5" fill="#262626"/>
    <path d="M34 51.5C34 46.5 38.5 45.5 45 45.5C51.5 45.5 56 46.5 56 51.5" stroke="#262626" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Botón Seguir (estático, no editable) -->
    <rect x="257" y="31" width="92" height="28" rx="4" stroke="#3897f0" stroke-width="1.2"/>
    <text x="303" y="49" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12" fill="#3897f0" text-anchor="middle">Seguir</text>

    <!-- Opciones (tres puntos) -->
    <circle cx="370" cy="46" r="1.5" fill="#262626"/>
    <circle cx="377" cy="46" r="1.5" fill="#262626"/>
    <circle cx="384" cy="46" r="1.5" fill="#262626"/>
  </g>

  <!-- ÍCONOS DE INTERACCIÓN (justo debajo de la foto) -->
  <g id="actions" transform="translate(25, 452)">
    <!-- Corazón (like) -->
    <path d="M11 4.5C11 4.5 9.5 2 6.5 2C3 2 1 5 1 8.5C1 13 11 19 11 19C11 19 21 13 21 8.5C21 5 19 2 15.5 2C12.5 2 11 4.5 11 4.5Z" stroke="#262626" stroke-width="2" stroke-linejoin="round"/>
    <!-- Comentario -->
    <path d="M48 2H68C70 2 71 3 71 5V17C71 19 70 20 68 20H55L48 25V2Z" stroke="#262626" stroke-width="2" stroke-linejoin="round" transform="translate(5, 0)"/>
    <!-- Compartir (avión) -->
    <path d="M102 2L125 11L102 20L108 11L102 2Z" stroke="#262626" stroke-width="2" stroke-linejoin="round" transform="translate(10, 0)"/>
    <!-- Guardar (bookmark) -->
    <path d="M335 2V22L345 16L355 22V2H335Z" stroke="#262626" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
