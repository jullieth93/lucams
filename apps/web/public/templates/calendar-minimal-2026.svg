<?xml version="1.0" encoding="UTF-8"?>
<!--
  Calendario Minimal 2026 — M.3.b.A2.
  Diseño minimal con accent coral y bordes finos.
  Stage 1080×1400.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1400" width="1080" height="1400">
  <!-- Background blanco fullbleed -->
  <rect x="0" y="0" width="1080" height="1400" fill="#FFFFFF"/>

  <!-- Accent line coral en la parte inferior (debajo del área del texto) -->
  <rect x="80" y="1130" width="120" height="6" fill="#F58A6F"/>

  <!-- Footer fino con número de mes (placeholder, el texto editable va encima) -->
  <text x="900" y="1330" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#999" text-anchor="end">
    LUCAMS · 2026
  </text>

  <!-- Borde fino del área foto -->
  <rect x="0" y="900" width="1080" height="1" fill="#E5E5E5"/>
</svg>
