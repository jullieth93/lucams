<svg width="240" height="720" viewBox="0 0 240 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mockup "Magnéticos — 2×6 cm" (regenerado 2026-09-15, D4) — separador de
    libros magnético: UNA tira 12×2 cm que se DOBLA sobre la página (imán con
    imán). Composición VERTICAL con el aspect real de la cara (1:3, stage
    200×600): antes era apaisada (620×240, tira desplegada cara A | cara B) y
    dentro del marco vertical del TemplateCard se veía chica y horizontal.
    Se muestra la pieza doblada sobre una página: cara B asomando por detrás,
    línea de doblez en el borde de la hoja, cara A (1:3) al frente. El diseño
    del cliente va a sangre en cada cara.
  -->
  <text x="120" y="40" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" fill="#3D2E5C">Cara B</text>
  <!-- cara B (detrás de la página, asoma por arriba) -->
  <rect x="75" y="58" width="90" height="270" rx="16" fill="#7C6AAD"/>
  <rect x="83" y="66" width="74" height="180" rx="10" fill="#FFE5EC"/>
  <g fill="#7C6AAD" opacity="0.35" transform="translate(120 108) scale(0.7)">
    <path d="M0 21c-11-9-24-18-24-30 0-7 5-12 12-12 5 0 9 3 12 8 4-5 7-8 12-8 7 0 12 5 12 12 0 12-13 21-24 30z"/>
  </g>
  <!-- página del libro -->
  <rect x="30" y="150" width="180" height="470" rx="10" fill="#FFF8F0" stroke="#E7DFF3" stroke-width="2"/>
  <!-- línea de doblez (la tira se pliega sobre el borde de la hoja) -->
  <line x1="72" y1="150" x2="168" y2="150" stroke="#3D2E5C" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <!-- cara A (frente, 1:3 como la cara física 2×6) -->
  <rect x="75" y="170" width="90" height="270" rx="16" fill="#7C6AAD"/>
  <rect x="83" y="178" width="74" height="254" rx="10" fill="#F4ECFF"/>
  <g fill="#7C6AAD" opacity="0.35" transform="translate(120 290) scale(0.85)">
    <path d="M0 21c-11-9-24-18-24-30 0-7 5-12 12-12 5 0 9 3 12 8 4-5 7-8 12-8 7 0 12 5 12 12 0 12-13 21-24 30z"/>
  </g>
  <!-- imanes (interior de cada cara) -->
  <circle cx="105" cy="416" r="4" fill="#3D2E5C" opacity="0.35"/>
  <circle cx="135" cy="416" r="4" fill="#3D2E5C" opacity="0.35"/>
  <text x="120" y="472" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" fill="#3D2E5C">Cara A</text>
  <text x="120" y="656" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" fill="#7C6AAD">Separador magnético 2×6 cm</text>
  <text x="120" y="682" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" fill="#7C6AAD">se dobla sobre la página</text>
</svg>
