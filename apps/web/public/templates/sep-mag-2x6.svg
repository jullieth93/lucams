<svg width="620" height="240" viewBox="0 0 620 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mockup "Magnéticos — 2×6 cm" (2026-09-14) — separador de libros magnético:
    la pieza es UNA tira 12×2 cm que se DOBLA sobre la página (imán con imán).
    Se muestra desplegada: cara A | cara B, con la línea de doblez al centro.
    El diseño del cliente va a sangre en cada cara.
  -->
  <rect x="10" y="50" width="600" height="100" rx="20" fill="#7C6AAD"/>
  <rect x="18" y="58" width="284" height="84" rx="14" fill="#F4ECFF"/>
  <rect x="318" y="58" width="284" height="84" rx="14" fill="#FFE5EC"/>
  <!-- línea de doblez -->
  <line x1="310" y1="56" x2="310" y2="144" stroke="#3D2E5C" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <g fill="#7C6AAD" opacity="0.35">
    <path d="M160 108c-11-9-24-18-24-30 0-7 5-12 12-12 5 0 9 3 12 8 4-5 7-8 12-8 7 0 12 5 12 12 0 12-13 21-24 30z"/>
    <path d="M460 108c-11-9-24-18-24-30 0-7 5-12 12-12 5 0 9 3 12 8 4-5 7-8 12-8 7 0 12 5 12 12 0 12-13 21-24 30z"/>
  </g>
  <text x="160" y="180" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="16" fill="#3D2E5C">Cara A</text>
  <text x="460" y="180" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="16" fill="#3D2E5C">Cara B</text>
  <text x="310" y="216" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" fill="#7C6AAD">Separador magnético 6×2 cm · se dobla sobre la página</text>
</svg>
