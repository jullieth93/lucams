<?xml version="1.0" encoding="UTF-8"?>
<!--
  Preview de la plantilla "Calendario mes a mes" (Ola 4, Lucy 2026-07-23).
  Tarjeta 7.5×10 cm (3:4, stage 600×800). Foto arriba + título del mes
  (ENE 2027) + grilla de días pequeña. Solo preview estático; la composición
  real con la foto del cliente se genera en el Estudio y en producción.
  Colores de marca: lavanda #7C6AAD, púrpura oscuro #3D2E5C, rosa #E85B9F,
  crema #FFF8F0.
-->
<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tarjeta con fondo crema y borde suave lavanda -->
  <rect x="1" y="1" width="598" height="798" rx="18" fill="#FFF8F0" stroke="#7C6AAD" stroke-width="2"/>

  <!-- Zona de foto (placeholder) -->
  <rect x="0" y="0" width="600" height="450" fill="url(#photoGradient)"/>
  <defs>
    <linearGradient id="photoGradient" x1="0" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4ECFF"/>
      <stop offset="0.35" stop-color="#FFE5EC"/>
      <stop offset="0.7" stop-color="#FFF2D9"/>
      <stop offset="1" stop-color="#DDF5F3"/>
    </linearGradient>
  </defs>

  <!-- Icono de foto sutil en el centro del placeholder -->
  <g transform="translate(260, 190)" opacity="0.55">
    <rect x="0" y="0" width="80" height="70" rx="10" fill="none" stroke="#7C6AAD" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="28" cy="24" r="9" fill="#7C6AAD"/>
    <path d="M8 62 L28 36 L45 52 L60 38 L72 62 Z" fill="#7C6AAD"/>
  </g>

  <!-- Título del mes -->
  <text x="300" y="532" font-family="Fredoka, sans-serif" font-size="72" font-weight="700" fill="#3D2E5C" text-anchor="middle">ENE 2027</text>

  <!-- Franja decorativa rosa bajo el título -->
  <rect x="150" y="555" width="300" height="6" rx="3" fill="#E85B9F" opacity="0.85"/>

  <!-- Encabezados de días de la semana -->
  <g font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#7C6AAD" text-anchor="middle">
    <text x="100" y="602">D</text>
    <text x="172" y="602">L</text>
    <text x="244" y="602">M</text>
    <text x="316" y="602">M</text>
    <text x="388" y="602">J</text>
    <text x="460" y="602">V</text>
    <text x="532" y="602">S</text>
  </g>

  <!-- Línea separadora -->
  <line x1="60" y1="615" x2="540" y2="615" stroke="#7C6AAD" stroke-width="1.5" opacity="0.35"/>

  <!-- Grilla de días (calendario ficticio: 1-31) -->
  <g font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#3D2E5C" text-anchor="middle">
    <!-- Semana 1: empieza viernes 1 -->
    <text x="388" y="652">1</text>
    <text x="460" y="652">2</text>
    <text x="532" y="652">3</text>
    <!-- Semana 2 -->
    <text x="100" y="692">4</text>
    <text x="172" y="692">5</text>
    <text x="244" y="692">6</text>
    <text x="316" y="692">7</text>
    <text x="388" y="692">8</text>
    <text x="460" y="692">9</text>
    <text x="532" y="692">10</text>
    <!-- Semana 3 -->
    <text x="100" y="732">11</text>
    <text x="172" y="732">12</text>
    <text x="244" y="732">13</text>
    <text x="316" y="732">14</text>
    <text x="388" y="732">15</text>
    <text x="460" y="732">16</text>
    <text x="532" y="732">17</text>
    <!-- Semana 4 -->
    <text x="100" y="772">18</text>
    <text x="172" y="772">19</text>
    <text x="244" y="772">20</text>
    <text x="316" y="772">21</text>
    <text x="388" y="772">22</text>
    <text x="460" y="772">23</text>
    <text x="532" y="772">24</text>
    <!-- Semana 5 -->
    <text x="100" y="812">25</text>
    <text x="172" y="812">26</text>
    <text x="244" y="812">27</text>
    <text x="316" y="812">28</text>
    <text x="388" y="812">29</text>
    <text x="460" y="812">30</text>
    <text x="532" y="812">31</text>
  </g>

  <!-- Día destacado (círculo rosa) -->
  <circle cx="316" cy="724" r="22" fill="#E85B9F" opacity="0.25"/>
</svg>
