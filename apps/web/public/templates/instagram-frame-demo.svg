<?xml version="1.0" encoding="UTF-8"?>
<!--
  Instagram Frame Demo — M.3.b.A2 (bonus por ref imagen Lucy).
  Estilo Instagram post: header avatar + username + Follow + área foto + footer icons.
  Stage 740×740 (cuadrado Instagram). Foto en (40, 100) tamaño 660×500.

  Username y caption son text layers editables que van encima de este SVG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 740" width="740" height="740">
  <defs>
    <filter id="ig-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background blanco fullbleed con sombra exterior + cornerRadius -->
  <rect x="20" y="20" width="700" height="700" rx="12" fill="#FFFFFF" filter="url(#ig-shadow)"/>

  <!-- Header (top 80px): avatar + username + Follow + 3 dots -->
  <!-- Avatar circle -->
  <circle cx="60" cy="60" r="22" fill="none" stroke="#999" stroke-width="2"/>
  <!-- Avatar persona icon (simplified silhouette) -->
  <g transform="translate(60 60)" fill="#999">
    <circle cx="0" cy="-5" r="6"/>
    <path d="M -10 8 Q 0 0 10 8 L 10 14 L -10 14 Z"/>
  </g>

  <!-- Three dots icon (top right) -->
  <g transform="translate(700 60)" fill="#333">
    <circle cx="0" cy="0" r="2.5"/>
    <circle cx="-12" cy="0" r="2.5"/>
    <circle cx="-24" cy="0" r="2.5"/>
  </g>

  <!-- Follow button (rounded turquoise outline) -->
  <rect x="540" y="42" width="100" height="36" rx="18" fill="none" stroke="#5DD9D1" stroke-width="2"/>
  <text x="590" y="65" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#5DD9D1" text-anchor="middle">
    FOLLOW
  </text>

  <!-- Linea separadora bajo el header -->
  <line x1="20" y1="100" x2="720" y2="100" stroke="#F0F0F0" stroke-width="1"/>

  <!-- Footer (debajo de la foto, 100px) -->
  <!-- Icon row: corazón, comment, share + bookmark -->
  <!-- Heart icon -->
  <g transform="translate(60 630)" fill="none" stroke="#000" stroke-width="2.5">
    <path d="M 0 14 C -10 6 -22 -4 -22 -14 C -22 -20 -18 -24 -12 -24 C -6 -24 -2 -20 0 -16 C 2 -20 6 -24 12 -24 C 18 -24 22 -20 22 -14 C 22 -4 10 6 0 14 Z"/>
  </g>
  <!-- Comment bubble icon -->
  <g transform="translate(130 630)" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round">
    <path d="M -22 -18 L 22 -18 Q 24 -18 24 -16 L 24 8 Q 24 10 22 10 L -8 10 L -16 18 L -16 10 L -22 10 Q -24 10 -24 8 L -24 -16 Q -24 -18 -22 -18 Z"/>
  </g>
  <!-- Share (paper plane) -->
  <g transform="translate(200 630)" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round">
    <path d="M -22 8 L 22 -14 L 14 18 L 4 4 Z"/>
  </g>

  <!-- Bookmark (top right of footer) -->
  <g transform="translate(680 630)" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round">
    <path d="M -10 -18 L 10 -18 L 10 18 L 0 8 L -10 18 Z"/>
  </g>

  <!-- Heart fill (likes indicator) + count -->
  <g transform="translate(50 680)">
    <path d="M 0 6 C -4 3 -10 -2 -10 -7 C -10 -10 -7 -12 -4 -12 C -1 -12 1 -10 0 -8 C -1 -10 1 -12 4 -12 C 7 -12 10 -10 10 -7 C 10 -2 4 3 0 6 Z" fill="#000"/>
  </g>

  <!-- Likes count placeholder -->
  <text x="75" y="685" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#000">
    362 likes
  </text>

  <!-- Microcopy "Diseña tu Instagram pos" en el footer aún más bajo (NO editable) -->
  <text x="50" y="715" font-family="Inter, sans-serif" font-size="11" fill="#3897F0">
    #lucamsshop #mirecuerdo
  </text>
</svg>
