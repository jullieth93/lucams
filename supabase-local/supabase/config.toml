# Stack LOCAL de Supabase para desarrollo diario (espejo de la nube).
#
# Mismo criterio que el workdir del Nightly (.github/ci/localstack): se corre
# `supabase start` desde ESTE directorio SIN supabase/migrations propio, porque
# las migraciones del repo (supabase/migrations/*) tocan tablas Prisma que aún
# no existen al boot — se aplican después, en orden (ver Makefile db-local-setup):
#   prisma migrate deploy → psql supabase/migrations/* → grants/RLS → seeds.
#
# Las credenciales del stack local son deterministas de desarrollo (salen de
# `supabase status -o env`); no son secretos reales.
project_id = "lucams-local"

# MFA TOTP habilitado igual que en el localstack de CI (el E2E admin-mfa y el
# flujo real de seguridad lo necesitan).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# URL del sitio en dev (auditoría 2026-08-01): el default del CLI
# (http://127.0.0.1:3000) NO es este proyecto — la app corre en :4000 y se
# navega desde otros dispositivos por la IP de red. De aquí sale la etiqueta
# que muestra el authenticator al enrolar TOTP y el destino de cualquier link
# de email (los flujos del proyecto usan códigos OTP, no links — ADR-030).
# OJO: aplica al RECREAR el stack (los contenedores leen esto al crearse) —
# en un stack ya corriendo no hace falta re-enrolar: el secreto TOTP sigue
# válido; basta renombrar la entrada en el authenticator.
[auth]
site_url = "http://192.168.20.180:4000"
additional_redirect_urls = [
  "http://localhost:4000",
  "http://127.0.0.1:4000",
  "http://192.168.20.180:4000",
]

# Emails de auth como en PRD (homologación 2026-08-05): exigir confirmación por
# email y plantillas con código OTP numérico ({{ .Token }}) — sin esto, gotrue
# autoconfirmaba el registro (sin email) y la recuperación mandaba un link PKCE
# genérico, nada que ver con el flujo real (verificación auth E2E).
# Aplica al RECREAR el stack (igual que site_url).
[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Tu código de confirmación — Lucams (pruebas)"
# El CLI resuelve content_path relativo al workdir (supabase-local), no al
# directorio del config — verificado 2026-08-07 al recrear el stack.
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Tu código para restablecer la contraseña — Lucams (pruebas)"
content_path = "./supabase/templates/recovery.html"
